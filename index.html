  rrect(6, 6, W-12, 26, 13, "rgba(14,18,48,0.85)", "#4be0d0", 2);
  text("Fundude Town", 16, 12, 12, "#ffcf3a");
  const counter = `${game.caught.size}/${ALL_SPECIES.length}`;
  ctx.font = `800 11px ${UI_FONT}`;
  const cw = ctx.measureText(counter).width + 18;
  rrect(W - cw - 12, 10, cw, 18, 9, "#4be0d0");
  text(counter, W - 12 - cw/2, 13, 11, "#0b1f1c", "center");
  if (!game.hasStarter) {
    // Non-blinking, always-visible hint pill just below HUD
    const label = "Visit Professor Ribbit's lab (green roof)";
    ctx.font = `700 11px ${UI_FONT}`;
    const lw = Math.min(W - 24, ctx.measureText(label).width + 26);
    const bob = Math.sin(performance.now()/300) * 2;
    rrect(W/2 - lw/2, 38 + bob, lw, 22, 11, "#ffcf3a", "#1a0a2a", 2);
    text(label, W/2, 41 + bob, 11, "#1a0a2a", "center");
  }
}
function drawBattle() {
  const b = game.battle;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, "#4a7fd6"); g.addColorStop(1, "#9ec3f0");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "#7d5a2a";
  ctx.beginPath(); ctx.ellipse(W-90, 210, 80, 22, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(90, 360, 90, 26, 0, 0, Math.PI*2); ctx.fill();

  const sh = shakeOffset();
  ctx.save(); ctx.translate(sh.x, sh.y);
  drawHPBox(20, 30, `Wild ${displayName(b.wild.species)}`, b.wild.hp, b.wild.maxHP);
  drawMon(b.wild, W-90, 200, 1.4, -1);
  drawMon(b.active, 90, 340, 1.6, 1);
  drawHPBox(W-190, 300, `${displayName(b.active.species)}`, b.active.hp, b.active.maxHP);
  ctx.restore();

  drawVfxOverlay();

  // Chunky menu panel
  const y = H - 200;
  rrect(6, y+4, W-12, 190, 16, "#0e1230", "#4be0d0", 3);
  if (!b.ended) {
    if (b.menu === "root") {
      text(`What will ${displayName(b.active.species)} do?`, 20, y+18, 13, "#c9f0ff");
      // 3 chunky pill buttons stacked
      const bw = W - 40, bh = 38, bx = 20;
      ROOT_OPTS.forEach((opt, i) => {
        const by = y + 46 + i * 44;
        const colours = {
          FIGHT: { bg:"#e85a2a", fg:"#fff" },
          CATCH: { bg:"#4be0d0", fg:"#0b1f1c" },
          RUN:   { bg:"#8892c8", fg:"#fff" }
        }[opt] || { bg:"#3a4390", fg:"#fff" };
        pillButton(bx, by, bw, bh, opt, {
          focused: i === b.cursor,
          bg: i === b.cursor ? colours.bg : "#2a3170",
          fg: i === b.cursor ? colours.fg : "#c9c9ff",
          fontSize: 16
        });
      });
    } else if (b.menu === "fight") {
      text(`Choose a move:`, 20, y+18, 13, "#c9f0ff");
      const moves = b.active.moves;
      const bw = W - 40, bh = 42, bx = 20;
      moves.forEach((mk, i) => {
        const m = MOVES[mk];
        const by = y + 46 + i * 48;
        const color = TYPE_COLORS[m.type] || "#3a4390";
        pillButton(bx, by, bw, bh, m.name.toUpperCase(), {
          focused: i === b.cursor,
          bg: i === b.cursor ? color : "rgba(255,255,255,0.12)",
          fg: "#fff",
          fontSize: 13
        });
        // Type badge on the right side of the button
        drawTypeBadge(bx + bw - 30, by + bh/2, m.type, 0.85);
      });
      text("B: back", W-24, y+180, 10, "#c9c9ff", "right");
    }
  } else {
    pillButton(W/2 - 120, y+80, 240, 40, "PRESS A TO CONTINUE", { focused:true, fontSize:14 });
  }
}
function drawHPBox(x, y, name, hp, maxHP) {
  rrect(x, y, 170, 48, 10, "rgba(0,0,0,0.75)", "#fff", 2);
  text(name, x+10, y+6, 12, "#fff");
  const bw = 150, frac = Math.max(0, hp/maxHP);
  // Track
  rrect(x+8, y+26, bw, 12, 6, "#221a2e", "#000", 1);
  const color = frac > 0.5 ? "#4bd07a" : frac > 0.2 ? "#ffcf3a" : "#e05a5a";
  // Filled bar
  if (frac > 0) rrect(x+8, y+26, bw*frac, 12, 6, color);
  // Segment ticks on the track for readability
  ctx.save();
  ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 1;
  for (let i=1;i<10;i++){ const gx = x+8 + bw*i/10; ctx.beginPath(); ctx.moveTo(gx, y+27); ctx.lineTo(gx, y+37); ctx.stroke(); }
  ctx.restore();
  text(`${hp}/${maxHP}`, x+162, y+6, 10, "#c9f0ff", "right");
}
// ==============================================================
// CroakyDex (v0.12.0) — a proper grid + detail view
// ==============================================================
function updateDex() {
  if (game.dexView !== "detail") {
    // grid navigation
    const cols = 2, count = ALL_SPECIES.length;
    if (pressed.left)  { game.dexCursor = (game.dexCursor + count - 1) % count; Audio.SFX.menu(); }
    if (pressed.right) { game.dexCursor = (game.dexCursor + 1) % count; Audio.SFX.menu(); }
    if (pressed.up)    { game.dexCursor = (game.dexCursor - cols + count) % count; Audio.SFX.menu(); }
    if (pressed.down)  { game.dexCursor = (game.dexCursor + cols) % count; Audio.SFX.menu(); }
    if (pressed.a)     { Audio.SFX.select(); game.dexView = "detail"; }
    if (pressed.b)     { Audio.SFX.back(); game.state = STATE.OVERWORLD; }
  } else {
    // detail: L/R flip through species, B closes
    const count = ALL_SPECIES.length;
    if (pressed.left)  { game.dexCursor = (game.dexCursor + count - 1) % count; Audio.SFX.menu(); }
    if (pressed.right) { game.dexCursor = (game.dexCursor + 1) % count; Audio.SFX.menu(); }
    if (pressed.b || pressed.a) { Audio.SFX.back(); game.dexView = "grid"; }
  }
}
function drawCollection() {
  if (game.dexView === "detail") return drawDexDetail();
  drawDexGrid();
}
function drawDexGrid() {
  // background gradient
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, "#0e1230"); g.addColorStop(1, "#1a2058");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // Header
  text("CROAKYDEX", W/2, 18, 22, "#ffcf3a", "center");
  const caughtLabel = `Caught: ${game.caught.size} / ${ALL_SPECIES.length}`;
  ctx.font = "800 12px 'Fredoka', -apple-system, sans-serif";
  const cw = ctx.measureText(caughtLabel).width + 20;
  rrect(W/2 - cw/2, 46, cw, 20, 10, "#4be0d0");
  text(caughtLabel, W/2, 51, 12, "#0b1f1c", "center");
  // Grid: 2 cols
  const cardW = 150, cardH = 140, gapX = 14, gapY = 12;
  const startX = (W - cardW*2 - gapX) / 2;
  const startY = 82;
  const t = performance.now() / 1000;
  ALL_SPECIES.forEach((sp, i) => {
    const col = i % 2, row = Math.floor(i / 2);
    const x = startX + col * (cardW + gapX);
    const y = startY + row * (cardH + gapY);
    const cx = x + cardW / 2;
    const focused = i === game.dexCursor;
    const sd = SPECIES[sp] || {};
    const bg = focused ? "#3a4390" : "#1a2050";
    const border = focused ? "#ffcf3a" : "#4be0d0";
    panel(x, y, cardW, cardH, bg, border, 12);
    // Number badge top-left — uses the entry's own dexOrder so numbers survive
    // reorders and match Sam's evolutionary slot (e.g. #010, #020).
    const dexNum = typeof sd.dexOrder === "number" ? sd.dexOrder : (i+1);
    rrect(x+6, y+6, 40, 16, 8, "rgba(0,0,0,0.5)");
    text(`#${String(dexNum).padStart(3,"0")}`, x+26, y+9, 10, "#ffcf3a", "center");
    // Top-right status pill: CAUGHT (green) or NOT SEEN (grey)
    const isCaught = game.caught.has(sp);
    const statusLabel = isCaught ? "CAUGHT" : "NOT SEEN";
    ctx.font = `800 8.5px ${UI_FONT}`;
    const stW = ctx.measureText(statusLabel).width + 12;
    const stCol = isCaught ? "#4bd07a" : "#5a5a72";
    rrect(x + cardW - stW - 6, y + 6, stW, 16, 8, stCol, "rgba(0,0,0,0.55)", 1.2);
    ctx.fillStyle = isCaught ? "#0b1f14" : "#dcdce8";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(statusLabel, x + cardW - stW/2 - 6, y + 15);
    if (isCaught) {
      drawMon({species:sp}, cx, y + 58, 0.9, 0, "portrait");
      text(displayName(sp), cx, y + cardH - 42, 12, "#fff", "center");
      // type badges centred
      const types = [sd.type, sd.type2].filter(Boolean);
      const badgeSpacing = 46;
      const startBadgeX = cx - ((types.length-1) * badgeSpacing) / 2;
      types.forEach((t, ti) => drawTypeBadge(startBadgeX + ti * badgeSpacing, y + cardH - 20, t, 0.9));
    } else {
      // Silhouette instead of "???": draw the mon in near-solid dark so its
      // shape gives a hint without spoiling colours/details.
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.filter = "brightness(0)";
      drawMon({species:sp}, cx, y + 58, 0.9, 0, "portrait");
      ctx.filter = "none";
      ctx.restore();
      text(displayName(sp), cx, y + cardH - 42, 11, "#4a5490", "center");
      // Show type name(s) too, so the dex hints at what to look for
      const types = [sd.type, sd.type2].filter(Boolean);
      const label = types.join(" / ").toUpperCase();
      text(label, cx, y + cardH - 22, 9, "#5a648a", "center");
    }
  });
  // Bottom hint bar
  rrect(10, H-46, W-20, 32, 12, "rgba(0,0,0,0.5)");
  text("← → ↑ ↓ browse   A: inspect   B: back", W/2, H-38, 12, "#c9f0ff", "center");
}
function drawDexDetail() {
  const sp = ALL_SPECIES[game.dexCursor];
  const sd = SPECIES[sp] || {};
  const caught = game.caught.has(sp);
  // Background — subtle themed to primary type
  const primaryCol = TYPE_COLORS[sd.type] || "#3a4390";
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, primaryCol); g.addColorStop(1, "#0e1230");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // Top bar
  rrect(10, 14, W-20, 44, 14, "rgba(0,0,0,0.55)", "#4be0d0", 2);
  const dexNum = typeof sd.dexOrder === "number" ? sd.dexOrder : (game.dexCursor+1);
  text(`#${String(dexNum).padStart(3,"0")}`, 24, 26, 14, "#ffcf3a");
  text(displayName(sp), W/2, 22, 18, "#fff", "center");
  // Status pill (CAUGHT / NOT SEEN) — beneath the name for clarity
  const stLabel = caught ? "CAUGHT" : "NOT SEEN";
  const stCol = caught ? "#4bd07a" : "#5a5a72";
  ctx.font = `800 10px ${UI_FONT}`;
  const stW2 = ctx.measureText(stLabel).width + 14;
  rrect(W/2 - stW2/2, 42, stW2, 14, 7, stCol);
  ctx.fillStyle = caught ? "#0b1f14" : "#dcdce8";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(stLabel, W/2, 50);
  text("‹ L / R ›", W-24, 30, 11, "#c9f0ff", "right");
  // Big model area
  const cardX = 20, cardY = 74, cardW = W-40, cardH = 240;
  panel(cardX, cardY, cardW, cardH, "rgba(0,0,0,0.35)", "#fff", 16);
  if (caught) {
    drawMon({species:sp}, W/2, cardY + cardH/2, 2.1, 0, "portrait");
    // type badges
    const types = [sd.type, sd.type2].filter(Boolean);
    const spacing = 60;
    const sx = W/2 - ((types.length-1)*spacing)/2;
    types.forEach((t, i) => drawTypeBadge(sx + i*spacing, cardY + cardH - 18, t, 1.05));
  } else {
    // Silhouette
    ctx.save();
    ctx.globalAlpha = 0.95;
    ctx.filter = "brightness(0)";
    drawMon({species:sp}, W/2, cardY + cardH/2, 2.1, 0, "portrait");
    ctx.filter = "none";
    ctx.restore();
    // Type badges — visible so the trainer knows what to look for
    const types = [sd.type, sd.type2].filter(Boolean);
    const spacing = 60;
    const sx = W/2 - ((types.length-1)*spacing)/2;
    types.forEach((t, i) => drawTypeBadge(sx + i*spacing, cardY + cardH - 18, t, 1.05));
    text("Encounter one in the wild to reveal", W/2, cardY + 22, 12, "#c9c9ff", "center");
  }
  // Stats panel
  const sY = cardY + cardH + 10;
  panel(20, sY, W-40, 130, "rgba(0,0,0,0.55)", "#ffcf3a", 14);
  if (caught) {
    text("HP", 34, sY+14, 12, "#ffcf3a");
    // HP bar segments (visual only — max HP as fraction of a 60 baseline)
    const barW = W-90, barH = 12, barX = 60, barY = sY+14;
    const frac = Math.min(1, (sd.maxHP || 30) / 60);
    rrect(barX, barY, barW, barH, 6, "#221a2e");
    rrect(barX, barY, barW*frac, barH, 6, "#4bd07a");
    text(String(sd.maxHP || "-"), W-30, barY, 12, "#fff", "right");
    text("MOVES", 34, sY+42, 12, "#ffcf3a");
    (sd.moves || []).slice(0,2).forEach((mk, i) => {
      const m = MOVES[mk] || { name:mk, type:"normal" };
      const bx = 34 + i*(W-68)/2, by = sY + 60, bw = (W-84)/2, bh = 30;
      const col = TYPE_COLORS[m.type] || "#3a4390";
      rrect(bx, by, bw, bh, bh/2, col, "rgba(0,0,0,0.35)", 1.5);
      ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "800 11px 'Fredoka', -apple-system, sans-serif";
      const label = m.name.length > 14 ? m.name.slice(0,13) + "…" : m.name;
      ctx.fillText(label, bx + bw/2, by + bh/2 + 1);
    });
    if (sd.starter) {
      rrect(W-90, sY-10, 70, 20, 10, "#ffcf3a", "#1a0a2a", 1.5);
      text("STARTER", W-55, sY-7, 10, "#1a0a2a", "center");
    }
  } else {
    text("Stats hidden until caught.", W/2, sY+50, 12, "#a6adcf", "center");
  }
  // Bottom prompt
  rrect(10, H-46, W-20, 32, 12, "rgba(0,0,0,0.6)");
  text("← → cycle   B / A: back", W/2, H-38, 12, "#c9f0ff", "center");
}
function drawWin() {
  clear("#1a1e46");
  text("You did it!", W/2, 80, 28, "#ffcf3a", "center");
  text("You caught them all!", W/2, 120, 18, "#4be0d0", "center");
  layoutMonsGrid(ALL_SPECIES, W/2, 280, 100, 130, 3, "portrait", 1.15);
  text("(Team Evil Soup will return... v0.3)", W/2, 540, 11, "#a6adcf", "center");
  text("A: play again", W/2, 580, 14, "#ffcf3a", "center");
  if (pressed.a) {
    Audio.SFX.select();
    game.party = []; game.caught = new Set();
    game.hasStarter = false;
    game.player.x = 7; game.player.y = 10;
    game.state = STATE.TITLE;
  }
}

// ==============================================================
// Main loop
// ==============================================================
let lastT = performance.now();
function tick(now) {
  const dt = Math.min(50, now - lastT); lastT = now;
  game.frame++;
  ensureMusic();
  updateVfx(dt);
  if (game.msg) updateMsg();
  else if (!game.vfx) {
    switch (game.state) {
      case STATE.OVERWORLD:  updateOverworld(); break;
      case STATE.BATTLE:     updateBattle(); break;
      case STATE.PROFESSOR:  updateProfessor(); break;
      case STATE.COLLECTION: updateDex(); break;
    }
  }
  switch (game.state) {
    case STATE.TITLE:      drawTitle(); break;
    case STATE.CHOOSE:     drawChoose(); break;
    case STATE.OVERWORLD:  drawOverworld(); break;
    case STATE.BATTLE:     drawBattle(); break;
    case STATE.COLLECTION: drawCollection(); break;
    case STATE.WIN:        drawWin(); break;
    case STATE.PROFESSOR:  drawProfessorScreen(); break;
  }
  drawMsg();
  for (const k in pressed) pressed[k] = false;
  requestAnimationFrame(tick);
}
// Keep the browser tab in sync with the per-game title constant.
try { document.title = GAME_TITLE + " Gotta Catch Them All!  v" + VERSION; } catch(e){}

// Fire-and-forget the manifest fetch. Game boots with DEFAULT_SPECIES and
// swaps in the manifest-merged version as soon as it arrives.
loadMonsManifest();
requestAnimationFrame(tick);
</script>
