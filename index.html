<!-- Playful display + UI fonts (loaded by the tablet browser) -->

<style>

<script type="module">

<script>
"use strict";
// CroakyMon Gotta Catch Them All! — v0.12.0
// Additions this version: varied creature designs (dragon whelp, lightning bird,
// sprout turtle, ink squid), VFX for every move, WebAudio SFX + light music loop.

const VERSION = "0.12.0";
// Default win-count to trigger an evolution when a species declares evolvesTo
// but doesn't override the threshold.
const DEFAULT_EVOLVE_AT_WINS = 3;
// Per-game title shown in the logo and browser tab. Charlie's fork overrides this.
const GAME_TITLE = "CroakyMon";
// Per-game logo look: "sunset" (Sam's warm fire vibe) or "spooky" (Charlie's
// teal-purple wobble). Extend drawLogo() with more presets over time.
const GAME_LOGO_STYLE = "sunset";
// Per-state music track filenames. Files live under assets/audio/ and load
// lazily when a state first needs them. Missing files fall back silently to
// the built-in WebAudio chiptune loop, so the game never breaks if the mp3s
// haven't been dropped in yet.
const GAME_MUSIC = {
  title:  "assets/audio/town.mp3",
  town:   "assets/audio/town.mp3",
  battle: "assets/audio/battle.mp3",
  win:    "assets/audio/town.mp3",
};
const W = 360, H = 640;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function fit() {
  const pad = 20;
  const vw = window.innerWidth - pad, vh = window.innerHeight - pad;
  const scale = Math.min(vw / W, vh / H);
  const frame = document.getElementById("frame");
  frame.style.width = Math.floor(W * scale) + "px";
  frame.style.height = Math.floor(H * scale) + "px";
  canvas.style.width = "100%"; canvas.style.height = "100%";
}
window.addEventListener("resize", fit); fit();

// ==============================================================
// Mon3D — hidden Three.js renderer for real 3D CroakyMon models.
// Renders per species into an offscreen canvas which the 2D game
// blits onto its main canvas via drawImage. Falls back silently to
// polygon art when a species has no .glb loaded (yet).
// ==============================================================
const Mon3D = (() => {
  const REG = {};        // species (PascalCase) -> { model, ready }
  const TRIED = new Set(); // urls we've already asked GLTFLoader for
  // The species -> URL mapping is derived from the SPECIES table at runtime
  // (populated after the manifest loads). See registerFromSpecies below.
  let three = null, renderer = null, scene = null, camera = null, lights = null;
  let off = null; // offscreen canvas
  const OFF_SIZE = 256; // render resolution per mon
  let ready = false;

  function init(THREE) {
    three = THREE;
    off = document.createElement("canvas");
    off.width = OFF_SIZE; off.height = OFF_SIZE;
    try {
      renderer = new THREE.WebGLRenderer({ canvas: off, antialias: true, alpha: true, premultipliedAlpha: false });
      renderer.setPixelRatio(1);
      renderer.setSize(OFF_SIZE, OFF_SIZE, false);
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
    } catch (e) { console.warn("Mon3D: WebGL init failed:", e); return; }
    scene = new THREE.Scene();
    // Camera: near-orthographic-feeling perspective, framed for a ~2 unit tall creature
    camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    camera.position.set(0, 1.2, 5.5);
    camera.lookAt(0, 1.0, 0);
    // Lights: key + fill + rim, tuned for saturated cartoon materials.
    // Values increased for v0.12.0 — earlier setup was reading dark on OLED tablets.
    const key = new THREE.DirectionalLight(0xffffff, 2.4);
    key.position.set(3, 4, 4);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x88bbff, 1.1);
    fill.position.set(-3, 2, 2);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffcf3a, 0.9);
    rim.position.set(0, 3, -4);
    scene.add(rim);
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    ready = true;
  }
  function loadOne(species, url) {
    if (!ready) return;
    if (TRIED.has(url)) return;
    TRIED.add(url);
    const Loader = window.__GLTFLoader; if (!Loader) return;
    const loader = new Loader();
    loader.load(url,
      (gltf) => {
        const model = gltf.scene;
        // Auto-fit: scale so the longest bound is ~2 units, then centre at origin.
        const box = new three.Box3().setFromObject(model);
        const size = new three.Vector3(); box.getSize(size);
        const target = 2.0;
        const s = target / Math.max(size.x, size.y, size.z);
        model.scale.setScalar(s);
        const box2 = new three.Box3().setFromObject(model);
        const c2 = new three.Vector3(); box2.getCenter(c2);
        const size2 = new three.Vector3(); box2.getSize(size2);
        model.position.sub(c2);
        model.position.y += size2.y * 0.5;
        REG[species] = { model, ready: true };
        console.log("Mon3D: loaded", species, url);
      },
      undefined,
      (err) => { console.warn("Mon3D: failed to load", url, err && err.message || err); }
    );
  }
  // Called after the manifest loads (or on boot for the built-ins). Reads the
  // current SPECIES table and tries to load a .glb for each species.
  function registerFromSpecies() {
    if (typeof SPECIES !== "object") return;
    for (const key of Object.keys(SPECIES)) {
      const slug = SPECIES[key]._kebab || pascalToKebab(key);
      loadOne(key, "assets/mons/" + slug + ".glb");
    }
  }
  // Render a species to the offscreen canvas at a given facing (±1), then blit onto dstCtx.
  function render(species, dstCtx, cx, cy, scale, facing, tSeconds, pose) {
    const entry = REG[species];
    if (!ready || !entry || !entry.ready) return false;
    // Clear the scene of previous mon
    for (let i = scene.children.length - 1; i >= 0; i--) {
      const ch = scene.children[i];
      if (!ch.isLight) scene.remove(ch);
    }
    const m = entry.model;
    // pose="portrait" faces the camera head-on (title screen / dex).
    // pose="side" or default is the 3/4 battle angle.
    if (pose === "portrait") {
      m.rotation.y = Math.sin(tSeconds * 1.2) * 0.15; // gentle sway
    } else {
      m.rotation.y = (facing >= 0 ? 1 : -1) * (Math.PI * 0.25);
    }
    // Idle bob
    m.position.y = (m.userData.baseY ?? m.position.y);
    if (m.userData.baseY === undefined) m.userData.baseY = m.position.y;
    m.position.y = m.userData.baseY + Math.sin(tSeconds * 3) * 0.05;
    scene.add(m);
    renderer.render(scene, camera);
    // Blit — scale factor 1.0 in the 2D game maps to a ~50px sprite; use similar bounds
    const drawSize = 96 * scale;
    dstCtx.save();
    // small shadow
    dstCtx.fillStyle = "rgba(0,0,0,0.25)";
    dstCtx.beginPath(); dstCtx.ellipse(cx, cy + 22*scale, 22*scale, 5*scale, 0, 0, Math.PI*2); dstCtx.fill();
    dstCtx.drawImage(off, cx - drawSize/2, cy - drawSize/2 - 8*scale, drawSize, drawSize);
    dstCtx.restore();
    return true;
  }
  function has(species) {
    const e = REG[species]; return !!(e && e.ready);
  }
  // Wire up when Three arrives. Registers the built-ins immediately; the
  // manifest loader will call registerFromSpecies again after it merges.
  function boot() {
    if (window.__THREE) { init(window.__THREE); registerFromSpecies(); }
    else window.addEventListener("three-ready", () => { init(window.__THREE); registerFromSpecies(); }, { once: true });
  }
  boot();
  return { render, has, registerFromSpecies };
})();

// ==============================================================
// Audio — WebAudio synth. All sound generated procedurally.
// ==============================================================
const Audio = (() => {
  let ac = null, master = null, musicGain = null, sfxGain = null;
  let musicOn = true, muted = false;
  let musicNodes = [];
  function ensure() {
    if (ac) return;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
      musicGain = ac.createGain(); musicGain.gain.value = 0.18; musicGain.connect(master);
      sfxGain   = ac.createGain(); sfxGain.gain.value = 0.55; sfxGain.connect(master);
    } catch(e) { ac = null; }
  }
  function resume() { if (ac && ac.state === "suspended") ac.resume(); }
  function setMuted(v) {
    muted = v;
    if (master) master.gain.value = v ? 0 : 0.7;
    // Also mute/unmute the mp3 track (WebAudio graph doesn't cover it)
    if (htmlAudio) htmlAudio.muted = v;
  }
  function toggleMute() { setMuted(!muted); return muted; }
  // ---- SFX primitives ----
  function tone({freq=440, dur=0.15, type="square", vol=0.4, slide=null, attack=0.005, decay=null}) {
    if (!ac || muted) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(); o.type = type;
    const g = ac.createGain();
    o.frequency.setValueAtTime(freq, t);
    if (slide != null) o.frequency.exponentialRampToValueAtTime(Math.max(1, slide), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(sfxGain);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise({dur=0.2, vol=0.3, filterFreq=2000, filterQ=1, filterSlide=null}) {
    if (!ac || muted) return;
    const t = ac.currentTime;
    const bufSize = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random()*2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const filt = ac.createBiquadFilter(); filt.type = "bandpass";
    filt.frequency.setValueAtTime(filterFreq, t); filt.Q.value = filterQ;
    if (filterSlide != null) filt.frequency.exponentialRampToValueAtTime(Math.max(50, filterSlide), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(filt).connect(g).connect(sfxGain);
    src.start(t); src.stop(t + dur);
  }
  // ---- Named SFX ----
  const SFX = {
    step()       { tone({freq:220, dur:0.05, type:"triangle", vol:0.15}); },
    menu()       { tone({freq:660, dur:0.05, type:"square",   vol:0.25}); },
    select()     { tone({freq:880, dur:0.08, type:"square",   vol:0.3});
                   tone({freq:1320,dur:0.08, type:"square",   vol:0.2}); },
    back()       { tone({freq:440, dur:0.06, type:"square",   vol:0.2, slide:220}); },
    encounter()  {
      tone({freq:200, dur:0.15, type:"sawtooth", vol:0.35, slide:800});
      setTimeout(()=>tone({freq:400, dur:0.2, type:"square", vol:0.35, slide:1600}), 120);
    },
    hit(eff)     {
      noise({dur:0.18, vol:0.25 + Math.min(0.25, eff*0.1), filterFreq:1200, filterSlide:200});
      tone({freq: eff>1.5 ? 180 : 300, dur:0.12, type:"square", vol:0.3, slide: eff>1.5? 90 : 200});
    },
    faint()      {
      tone({freq:600, dur:0.5, type:"sawtooth", vol:0.4, slide:80});
    },
    catchThrow() {
      tone({freq:300, dur:0.15, type:"triangle", vol:0.3, slide:900});
    },
    catchShake() {
      tone({freq:520, dur:0.08, type:"square", vol:0.3});
      tone({freq:660, dur:0.08, type:"square", vol:0.2});
    },
    catchWin() {
      const notes = [523, 659, 784, 1047];
      notes.forEach((f, i) => setTimeout(()=>tone({freq:f,dur:0.15,type:"square",vol:0.35}), i*90));
    },
    catchFail() {
      tone({freq:400, dur:0.3, type:"sawtooth", vol:0.35, slide:120});
    },
    win() {
      const notes = [523, 659, 784, 1047, 1319];
      notes.forEach((f, i) => setTimeout(()=>tone({freq:f,dur:0.25,type:"triangle",vol:0.4}), i*140));
    },
    // Per-type move signatures
    fire() {
      noise({dur:0.45, vol:0.35, filterFreq:800, filterSlide:2400, filterQ:2});
      tone({freq:140, dur:0.4, type:"sawtooth", vol:0.25, slide:60});
    },
    electric() {
      for (let i=0;i<5;i++) setTimeout(()=>tone({freq:1200+Math.random()*800, dur:0.05, type:"square", vol:0.3}), i*35);
      tone({freq:80, dur:0.3, type:"square", vol:0.2, slide:40});
    },
    grass() {
      tone({freq:120, dur:0.25, type:"triangle", vol:0.35, slide:70});
      noise({dur:0.35, vol:0.2, filterFreq:3000, filterSlide:600, filterQ:1});
    },
    water() {
      noise({dur:0.5, vol:0.3, filterFreq:400, filterSlide:2000, filterQ:1});
      tone({freq:220, dur:0.3, type:"sine", vol:0.25, slide:660});
    },
    normal() {
      tone({freq:200, dur:0.12, type:"square", vol:0.3, slide:120});
    },
  };
  // ---- Music: prefers a real mp3 (per state, from GAME_MUSIC) with graceful
  //   fallback to the built-in chiptune loop when the file's missing or fails
  //   to play (offline / not yet dropped in).
  let htmlAudio = null;         // active <audio> element for real music
  let htmlAudioMood = null;     // which mood it's currently playing
  const failedUrls = new Set(); // don't retry mp3s that already 404'd this session
  function startMp3(mood) {
    const url = (typeof GAME_MUSIC === "object" && GAME_MUSIC[mood]) || null;
    if (!url || failedUrls.has(url) || muted || !musicOn) return false;
    if (htmlAudio && htmlAudioMood === mood && !htmlAudio.paused) return true;
    stopHtmlAudio();
    try {
      htmlAudio = new window.Audio(url);
      htmlAudio.loop = true;
      htmlAudio.volume = 0.35;
      htmlAudio.addEventListener("error", () => { failedUrls.add(url); htmlAudio = null; startSynthMusic(mood); });
      const p = htmlAudio.play();
      if (p && p.catch) p.catch(() => { /* autoplay blocked; will retry on gesture */ });
      htmlAudioMood = mood;
      return true;
    } catch (e) { failedUrls.add(url); return false; }
  }
  function stopHtmlAudio() {
    if (htmlAudio) { try { htmlAudio.pause(); htmlAudio.src = ""; } catch(e){} htmlAudio = null; htmlAudioMood = null; }
  }
  function startMusic(mood) {
    // Prefer the mp3 for this mood. If it works, silence the synth path.
    if (startMp3(mood)) { stopSynthMusic(); return; }
    startSynthMusic(mood);
  }
  function startSynthMusic(mood) {
    if (!ac || !musicOn) return;
    stopSynthMusic();
    const patterns = {
      town:   { root: 261.63, prog: [0, 4, 7, 4], tempo: 0.42, wave: "triangle" },
      battle: { root: 220.00, prog: [0, 3, 5, 7], tempo: 0.28, wave: "square" },
      title:  { root: 329.63, prog: [0, 4, 7, 12], tempo: 0.5, wave: "triangle" },
      win:    { root: 523.25, prog: [0, 4, 7, 12], tempo: 0.35, wave: "triangle" },
    };
    const p = patterns[mood] || patterns.town;
    const startAt = ac.currentTime + 0.05;
    // repeat pattern for 4 bars, then schedule loop
    let step = 0;
    const noteLen = p.tempo;
    const totalSteps = 32;
    for (let i = 0; i < totalSteps; i++) {
      const semis = p.prog[i % p.prog.length];
      const freq = p.root * Math.pow(2, semis/12);
      const t = startAt + i * noteLen;
      const o = ac.createOscillator(); o.type = p.wave;
      const g = ac.createGain();
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.6, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + noteLen*0.9);
      o.connect(g).connect(musicGain);
      o.start(t); o.stop(t + noteLen);
      musicNodes.push(o);
      // bass every 4 steps
      if (i % 4 === 0) {
        const bo = ac.createOscillator(); bo.type = "triangle";
        const bg = ac.createGain();
        bo.frequency.setValueAtTime(p.root/2, t);
        bg.gain.setValueAtTime(0, t);
        bg.gain.linearRampToValueAtTime(0.7, t + 0.02);
        bg.gain.exponentialRampToValueAtTime(0.001, t + noteLen*3.5);
        bo.connect(bg).connect(musicGain);
        bo.start(t); bo.stop(t + noteLen*4);
        musicNodes.push(bo);
      }
    }
    // Schedule next loop
    const total = totalSteps * noteLen;
    musicNodes.loopTimer = setTimeout(() => startSynthMusic(mood), total * 1000 - 100);
  }
  function stopSynthMusic() {
    if (musicNodes.loopTimer) clearTimeout(musicNodes.loopTimer);
    musicNodes.forEach(n => { try { n.stop(); } catch(e){} });
    musicNodes = [];
  }
  function stopMusic() { stopHtmlAudio(); stopSynthMusic(); }
  // Retry the mp3 on any first user interaction — browsers block autoplay
  // until the user has gestured. ensureMusic() re-invokes startMusic on that
  // tick, which will then be past the gate.
  return { ensure, resume, setMuted, toggleMute, SFX, startMusic, stopMusic,
           get isMuted() { return muted; } };
})();

// Mute button
const muteBtn = document.getElementById("muteBtn");
muteBtn.addEventListener("click", () => {
  Audio.ensure(); Audio.resume();
  const m = Audio.toggleMute();
  muteBtn.textContent = "SOUND: " + (m ? "OFF" : "ON");
});

// ==============================================================
// Input
// ==============================================================
const keys = { up:false, down:false, left:false, right:false, a:false, b:false };
const pressed = { up:false, down:false, left:false, right:false, a:false, b:false };
function setKey(k, v) {
  if (!(k in keys)) return;
  if (v && !keys[k]) pressed[k] = true;
  keys[k] = v;
  if (v) { Audio.ensure(); Audio.resume(); ensureMusic(); }
}
const KEYMAP = { ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right",
                 w:"up", s:"down", a:"left", d:"right", W:"up", S:"down", A:"left", D:"right",
                 " ":"a", Enter:"a", z:"a", Z:"a", x:"b", X:"b", Escape:"b" };
window.addEventListener("keydown", e => { const k = KEYMAP[e.key]; if (k) { setKey(k, true); e.preventDefault(); } });
window.addEventListener("keyup",   e => { const k = KEYMAP[e.key]; if (k) { setKey(k, false); e.preventDefault(); } });
document.querySelectorAll("[data-k]").forEach(btn => {
  const k = btn.dataset.k;
  const on = e => { e.preventDefault(); setKey(k, true); };
  const off = e => { e.preventDefault(); setKey(k, false); };
  btn.addEventListener("touchstart", on, {passive:false});
  btn.addEventListener("touchend", off); btn.addEventListener("touchcancel", off);
  btn.addEventListener("mousedown", on); btn.addEventListener("mouseup", off);
  btn.addEventListener("mouseleave", off);
});

// ==============================================================
// Game data
// ==============================================================
// Type chart. Ghost added in v0.12.0 (CryptyCrab). normal <-> ghost is 0.5 both
// ways (not the classical 0x) so a battle can never be un-winnable — this game
// is for kids.
const EFF = {
  fire:     { grass:2.0, water:0.5, fire:0.5, electric:1.0, normal:1.0, ghost:1.0 },
  water:    { fire:2.0, grass:0.5, water:0.5, electric:1.0, normal:1.0, ghost:1.0 },
  grass:    { water:2.0, fire:0.5, grass:0.5, electric:1.0, normal:1.0, ghost:1.0 },
  electric: { water:2.0, grass:1.0, fire:1.0, electric:0.5, normal:1.0, ghost:1.0 },
  normal:   { water:1.0, grass:1.0, fire:1.0, electric:1.0, normal:1.0, ghost:0.5 },
  ghost:    { water:1.0, grass:1.0, fire:1.0, electric:1.0, normal:0.5, ghost:2.0 },
};
const MOVES = {
  HotDiggityDoggyDog: { type:"fire",     power:14, name:"HotDiggityDoggyDog" },
  ThunderWay:         { type:"electric", power:14, name:"ThunderWay" },
  TreeStomp:          { type:"grass",    power:14, name:"Tree Stomp" },
  SharkWave:          { type:"water",    power:14, name:"Shark Wave" },
  SpookyPinch:        { type:"ghost",    power:14, name:"Spooky Pinch" },
  Tackle:             { type:"normal",   power:8,  name:"Tackle" },
};

// Species defaults — used until assets/mons/mons.json loads and merges on top.
// Shapes map to polygon-fallback draw functions (drawCrimsonFungus etc). To add
// a new creature: drop a .glb into assets/mons/ — a manifest entry is auto-added
// and the game picks it up.
const DEFAULT_SPECIES = {
  CrimsonFungus: { type:"fire",     color:"#e85a2a", accent:"#ffd05a", maxHP:34, moves:["HotDiggityDoggyDog","Tackle"], shape:"dragon", starter:true  },
  Bolttoad:      { type:"electric", color:"#f2c744", accent:"#fff2a8", maxHP:32, moves:["ThunderWay","Tackle"],         shape:"bird",   starter:false },
  Vinehop:       { type:"grass",    color:"#4fbf5a", accent:"#c4f770", maxHP:36, moves:["TreeStomp","Tackle"],          shape:"turtle", starter:true  },
  Tidefrog:      { type:"water",    color:"#3a9be0", accent:"#c9f0ff", maxHP:36, moves:["SharkWave","Tackle"],          shape:"squid",  starter:true  },
};
// Mutable — overwritten when the manifest loads.
let SPECIES     = Object.assign({}, DEFAULT_SPECIES);
let ALL_SPECIES = Object.keys(SPECIES);
let STARTERS    = ALL_SPECIES.filter(k => SPECIES[k].starter);

// Filename slug helpers: manifest / GLB filenames are kebab-case,
// code keys are PascalCase.
function kebabToPascal(s){ return String(s).split(/[-_ ]+/).map(w => w ? w[0].toUpperCase() + w.slice(1) : "").join(""); }
function pascalToKebab(s){ return String(s).replace(/([a-z0-9])([A-Z])/g, "$1-$2").toLowerCase(); }

// --- Manifest loader ---
// Fetches assets/mons/mons.json and merges each entry into SPECIES.
// Entry fields (all optional): name, types (or type + optional type2), hp,
// moves, starter, shape, color, accent. Missing fields fall back to
// DEFAULT_SPECIES[<key>] then to sane defaults, so a brand-new mon still
// battles even if you haven't customised it yet.
async function loadMonsManifest() {
  try {
    const r = await fetch("assets/mons/mons.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const manifest = await r.json();
    applyManifest(manifest);
    console.log("Mon manifest loaded:", Object.keys(manifest).length, "entries");
  } catch (e) {
    console.warn("Mon manifest not loaded, using embedded defaults:", e.message);
  }
}
function applyManifest(manifest) {
  const merged = {};
  for (const [kebab, entry] of Object.entries(manifest)) {
    const key = kebabToPascal(kebab);
    const base = DEFAULT_SPECIES[key] || {};
    const types = Array.isArray(entry.types) ? entry.types : (entry.type ? [entry.type] : null);
    merged[key] = {
      type:    (types && types[0]) || base.type   || "normal",
      type2:   (types && types[1]) || entry.type2 || base.type2 || null,
      color:   entry.color  || base.color  || "#a8a8a8",
      accent:  entry.accent || base.accent || "#e0e0e0",
      maxHP:   entry.hp || entry.maxHP || base.maxHP || 30,
      moves:   Array.isArray(entry.moves) && entry.moves.length ? entry.moves : (base.moves ? base.moves.slice() : ["Tackle"]),
      shape:   entry.shape || base.shape || "blob",
      starter: entry.starter != null ? !!entry.starter : (base.starter || false),
      // v0.12.0 — sharing between per-kid games.
      // shared:true means "this creature belongs in BOTH Sam's and Charlie's
      // games". A future sync workflow will mirror shared entries between
      // the two repos; today it's metadata only.
      shared:  entry.shared != null ? !!entry.shared : (base.shared || false),
      displayName: entry.name || null,
      // Evolution (v0.12.0): `evolvesTo` is a kebab slug of the next form.
      // `evolvesAtWins` is how many battle victories the party mon needs before
      // it transforms (default 3). `evolutionOf` marks a mon as reachable ONLY
      // via evolution — it is excluded from wild encounters.
      evolvesTo:     entry.evolvesTo     || base.evolvesTo     || null,
      evolvesAtWins: entry.evolvesAtWins || base.evolvesAtWins || null,
      evolutionOf:   entry.evolutionOf   || base.evolutionOf   || null,
      // dexOrder controls CroakyDex ordering (ascending). Missing entries sort last.
      dexOrder:      typeof entry.dexOrder === "number" ? entry.dexOrder :
                     (typeof base.dexOrder === "number" ? base.dexOrder : 9999),
      _kebab:  kebab,
    };
    // Silently swap unknown move names for Tackle so a manifest typo never crashes battle.
    merged[key].moves = merged[key].moves.map(m => MOVES[m] ? m : "Tackle");
  }
  // Keep any DEFAULT_SPECIES entries the manifest doesn't cover (dev-time fallback).
  for (const [key, v] of Object.entries(DEFAULT_SPECIES)) {
    if (!merged[key]) merged[key] = Object.assign({ _kebab: pascalToKebab(key) }, v);
  }
  SPECIES     = merged;
  // Ascending by dexOrder, then alphabetical fallback so a stable order emerges
  // even if two entries share the same number.
  ALL_SPECIES = Object.keys(SPECIES).sort((a, b) => {
    const da = SPECIES[a].dexOrder, db = SPECIES[b].dexOrder;
    if (da !== db) return da - db;
    return a.localeCompare(b);
  });
  STARTERS    = ALL_SPECIES.filter(k => SPECIES[k].starter);
  Mon3D.registerFromSpecies();
}

// Turn an internal species key like "CrimsonFungus" into a display name
// with spaces inserted before capital letters ("Crimson Fungus"). Single-word
// keys like "Bolttoad" pass through unchanged.
function displayName(sp) {
  const s = SPECIES[sp];
  if (s && s.displayName) return s.displayName;
  return sp.replace(/([a-z])([A-Z])/g, "$1 $2");
}

function makeMon(species) {
  const s = SPECIES[species];
  return {
    species,
    type:  s.type,
    type2: s.type2 || null,
    maxHP: s.maxHP,
    hp:    s.maxHP,
    moves: s.moves.slice(),
    wins:  0,  // battle wins with this instance — feeds evolution
  };
}
function damage(attacker, defender, moveKey, rng) {
  const m = MOVES[moveKey];
  const row = EFF[m.type] || {};
  // Dual-type defence: multiply the effectiveness through every type the
  // defender has. Species with a single .type behave exactly as before.
  const defTypes = [defender.type];
  if (defender.type2) defTypes.push(defender.type2);
  let eff = 1.0;
  for (const t of defTypes) eff *= (row[t] != null ? row[t] : 1.0);
  const roll = 0.85 + rng() * 0.30;
  // STAB: attacker gets the bonus if the move matches either of its types.
  const atkTypes = [attacker.type];
  if (attacker.type2) atkTypes.push(attacker.type2);
  const stab = atkTypes.includes(m.type) ? 1.5 : 1.0;
  const dmg = Math.max(1, Math.floor(m.power * eff * stab * roll));
  return { dmg, eff };
}

const TILE = 24;
const MAP_W = 15, MAP_H = 22;
// L = professor's house roof (top-left, replaces R so it renders in a different colour).
// D = professor's door tile — stepping on it triggers the starter-select scene.
const MAP = [
  "FFFFFFFFFFFFFFF","F.....PPP.....F","F.LLL.P.P.RRR.F","F.HHH.P.P.HHH.F",
  "F.HHH.P.P.HHH.F","F..D..P.P.....F","F.TTT.P.P.TTT.F","F.TTT.P.P.TTT.F",
  "F.....P.P.....F","F.PPPPPPPPPPP.F","F.P.........P.F","F.P.TTTTTTT.P.F",
  "F.P.TTTTTTT.P.F","F.P.TTTTTTT.P.F","F.P.........P.F","F.PPPPPPPPPPP.F",
  "F.....P.P.....F","F.RRR.P.P.RRR.F","F.HHH.P.P.HHH.F","F.HHH.P.P.HHH.F",
  "F.....PPP.....F","FFFFFFFFFFFFFFF",
];
function tileAt(x, y) {
  if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) return "F";
  return MAP[y][x];
}
function walkable(t) { return t === "." || t === "P" || t === "T" || t === "D"; }

// ==============================================================
// Draw primitives
// ==============================================================
function clear(color) { ctx.fillStyle = color; ctx.fillRect(0,0,W,H); }
function rect(x,y,w,h,c) { ctx.fillStyle = c; ctx.fillRect(x,y,w,h); }
function stroke(x,y,w,h,c,lw=1) { ctx.strokeStyle=c; ctx.lineWidth=lw; ctx.strokeRect(x+0.5,y+0.5,w-1,h-1); }
// Fonts: Fredoka for UI (loaded from Google Fonts by the tablet browser),
// with system fallback while it loads. Bangers is used only for the logo.
const UI_FONT = '"Fredoka", -apple-system, "Segoe UI", Roboto, sans-serif';
const LOGO_FONT = '"Bangers", "Fredoka", -apple-system, sans-serif';
function text(str, x, y, size=12, color="#fff", align="left") {
  ctx.fillStyle = color; ctx.font = `600 ${size}px ${UI_FONT}`;
  ctx.textAlign = align; ctx.textBaseline = "top"; ctx.fillText(str, x, y);
}

// ==============================================================
// UI kit (v0.12.0) — rounded rects, type badges, pill buttons.
// ==============================================================
function rrect(x, y, w, h, r, fill, stroke, sw) {
  const rr = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr, y);
  ctx.arcTo(x+w, y, x+w, y+h, rr);
  ctx.arcTo(x+w, y+h, x, y+h, rr);
  ctx.arcTo(x, y+h, x, y, rr);
  ctx.arcTo(x, y, x+w, y, rr);
  ctx.closePath();
  if (fill)   { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw || 2; ctx.stroke(); }
}
// Drop-shadowed panel for kid-friendly chunky cards
function panel(x, y, w, h, fill="#1e2456", stroke="#4be0d0", r=12) {
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(x+w/2, y+h+4, w*0.45, 6, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  rrect(x, y, w, h, r, fill, stroke, 2);
}
const TYPE_COLORS = {
  fire:"#e85a2a", water:"#3a9be0", grass:"#4bd07a",
  electric:"#f2c744", normal:"#c8b39d", ghost:"#8a72b8"
};
function drawTypeBadge(cx, cy, type, size=1) {
  const label = String(type || "").toUpperCase();
  ctx.font = `800 ${9*size}px 'Fredoka', -apple-system, sans-serif`;
  const w = ctx.measureText(label).width + 14*size;
  const h = 16*size;
  const x = cx - w/2, y = cy - h/2;
  const bg = TYPE_COLORS[type] || "#888";
  rrect(x, y, w, h, h/2, bg, "rgba(0,0,0,0.55)", 1.5);
  // slight highlight bar on top for depth
  ctx.save();
  ctx.globalAlpha = 0.35;
  rrect(x+2, y+2, w-4, h/2-2, (h-4)/2, "#fff");
  ctx.restore();
  ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `800 ${9*size}px 'Fredoka', -apple-system, sans-serif`;
  ctx.fillText(label, cx, cy + 0.5);
}
// Chunky pill button with drop shadow, optional focus highlight
function pillButton(x, y, w, h, label, opts) {
  opts = opts || {};
  const focused = !!opts.focused;
  const bg = opts.bg || (focused ? "#ffcf3a" : "#3a4390");
  const fg = opts.fg || (focused ? "#1a1a1a" : "#fff");
  // shadow
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  rrect(x+2, y+3, w, h, h/2, "rgba(0,0,0,0.35)");
  ctx.restore();
  rrect(x, y, w, h, h/2, bg, focused ? "#fff" : "rgba(255,255,255,0.5)", focused ? 3 : 2);
  // top glossy highlight
  ctx.save();
  ctx.globalAlpha = 0.28;
  rrect(x+4, y+3, w-8, h/2-3, (h-6)/2, "#fff");
  ctx.restore();
  ctx.fillStyle = fg; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `800 ${opts.fontSize || 14}px 'Fredoka', -apple-system, sans-serif`;
  ctx.fillText(label, x+w/2, y+h/2+1);
}

// ==============================================================
// Tiles / houses
// ==============================================================
// ---- Town tile art (v0.12.0 rework) ----
// Small deterministic PRNG so per-tile decorations (flowers, cracks) stay stable
// across frames and don't shimmer.
function hashRand(x, y, salt) {
  let h = ((x * 73856093) ^ (y * 19349663) ^ (salt * 83492791)) >>> 0;
  h = (h ^ (h >>> 13)) * 1274126177 >>> 0;
  h = (h ^ (h >>> 16)) >>> 0;
  return h / 4294967295;
}
function drawHouse(px, py) {
  // Cast a soft shadow underneath the whole building
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.ellipse(px + TILE*1.5, py + TILE*2.05, TILE*1.55, 5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  // Wall body — vertical wooden plank effect
  const wallX = px, wallY = py, wallW = TILE*3, wallH = TILE*2;
  const g = ctx.createLinearGradient(0, wallY, 0, wallY+wallH);
  g.addColorStop(0, "#f2d9a2"); g.addColorStop(1, "#c9a56a");
  ctx.fillStyle = g; ctx.fillRect(wallX, wallY, wallW, wallH);
  // Plank seams
  ctx.strokeStyle = "rgba(90,55,20,0.25)"; ctx.lineWidth = 1;
  for (let i = 1; i < 6; i++) {
    const gx = wallX + (wallW / 6) * i;
    ctx.beginPath(); ctx.moveTo(gx, wallY+3); ctx.lineTo(gx, wallY+wallH-3); ctx.stroke();
  }
  // Bottom brick trim
  ctx.fillStyle = "#8a5a34"; ctx.fillRect(wallX, wallY+wallH-4, wallW, 4);
  ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 1;
  for (let i = 0; i < 8; i++) {
    ctx.beginPath(); ctx.moveTo(wallX + (wallW/8)*i, wallY+wallH-4); ctx.lineTo(wallX + (wallW/8)*i, wallY+wallH); ctx.stroke();
  }
  // Door — arched
  const dw = 16, dh = 22, dx = wallX + wallW/2 - dw/2, dy = wallY + wallH - dh - 4;
  ctx.fillStyle = "#5b2f12";
  ctx.beginPath();
  ctx.moveTo(dx, dy+dh);
  ctx.lineTo(dx, dy+6);
  ctx.arc(dx+dw/2, dy+6, dw/2, Math.PI, 0);
  ctx.lineTo(dx+dw, dy+dh);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#3a1a08"; ctx.lineWidth = 1.5; ctx.stroke();
  // Door knob
  ctx.fillStyle = "#ffcf3a";
  ctx.beginPath(); ctx.arc(dx+dw-4, dy+dh-8, 1.5, 0, Math.PI*2); ctx.fill();
  // Windows with cross-mullion + sill
  const drawWin = (wx, wy) => {
    // sill
    ctx.fillStyle = "#8a5a34"; ctx.fillRect(wx-1, wy+10, 12, 3);
    // frame
    ctx.fillStyle = "#7a4a22"; ctx.fillRect(wx-1, wy-1, 12, 12);
    // glass
    const gg = ctx.createLinearGradient(0, wy, 0, wy+10);
    gg.addColorStop(0, "#a8dcff"); gg.addColorStop(1, "#5aa3d6");
    ctx.fillStyle = gg; ctx.fillRect(wx, wy, 10, 10);
    // cross
    ctx.strokeStyle = "#3a2010"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(wx+5, wy); ctx.lineTo(wx+5, wy+10); ctx.moveTo(wx, wy+5); ctx.lineTo(wx+10, wy+5); ctx.stroke();
  };
  drawWin(wallX + 6, wallY + TILE - 4);
  drawWin(wallX + wallW - 16, wallY + TILE - 4);
}
function drawRoof(px, py, palette="red") {
  const main   = palette === "prof" ? "#4b8a3e" : "#c0392b";
  const shade  = palette === "prof" ? "#2f6329" : "#8b2a1c";
  const trim   = palette === "prof" ? "#2a4a22" : "#5a1a10";
  // Base sloped roof
  ctx.fillStyle = main;
  ctx.beginPath();
  ctx.moveTo(px-4, py+TILE+2);
  ctx.lineTo(px+TILE*1.5, py-2);
  ctx.lineTo(px+TILE*3+4, py+TILE+2);
  ctx.closePath(); ctx.fill();
  // Right-side shading polygon (fake 3D)
  ctx.fillStyle = shade;
  ctx.beginPath();
  ctx.moveTo(px+TILE*1.5, py-2);
  ctx.lineTo(px+TILE*3+4, py+TILE+2);
  ctx.lineTo(px+TILE*1.5, py+TILE-4);
  ctx.closePath(); ctx.fill();
  // Ridge highlight
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px-2, py+TILE); ctx.lineTo(px+TILE*1.5, py); ctx.stroke();
  // Bottom trim / gutter
  ctx.fillStyle = trim; ctx.fillRect(px-4, py+TILE-1, TILE*3+8, 4);
  // Roof shingles (horizontal lines)
  ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 1;
  for (let y = 0; y < 3; y++) {
    const yy = py + 6 + y * 6;
    const spread = (yy - py) / (TILE) * (TILE*1.5);
    ctx.beginPath(); ctx.moveTo(px + TILE*1.5 - spread, yy); ctx.lineTo(px + TILE*1.5 + spread, yy); ctx.stroke();
  }
  if (palette === "prof") {
    // Chimney with animated-ish steam (fixed puff shapes so no shimmer)
    ctx.fillStyle = "#8a5a34"; ctx.fillRect(px + TILE*2 - 2, py+2, 8, 12);
    ctx.fillStyle = "#5a3a1a"; ctx.fillRect(px + TILE*2 - 3, py+1, 10, 3);
    ctx.fillStyle = "#e8f0ff";
    ctx.beginPath(); ctx.arc(px+TILE*2+2, py-2, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(px+TILE*2+8, py-8, 3.5, 0, Math.PI*2); ctx.fill();
    // Little "LAB" flag on top
    ctx.fillStyle = "#8a72b8"; ctx.fillRect(px + TILE*1.5 - 1, py - 12, 2, 12);
    ctx.fillStyle = "#ffcf3a";
    ctx.beginPath();
    ctx.moveTo(px + TILE*1.5 + 1, py - 12);
    ctx.lineTo(px + TILE*1.5 + 12, py - 9);
    ctx.lineTo(px + TILE*1.5 + 1, py - 6);
    ctx.closePath(); ctx.fill();
  }
}
function drawTile(tx, ty) {
  const t = MAP[ty][tx];
  const x = tx*TILE, y = ty*TILE;
  // Ground: base grass with checker + per-tile subtle noise + occasional flower/pebble
  if (t === "." || t === "P" || t === "T" || t === "H" || t === "R" || t === "L" || t === "D") {
    const base = (tx+ty)%2===0 ? "#6ecf5f" : "#5eb84f";
    ctx.fillStyle = base; ctx.fillRect(x, y, TILE, TILE);
    // Blades of grass tufts (deterministic)
    ctx.strokeStyle = "rgba(30,80,30,0.5)"; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const bx = x + hashRand(tx, ty, i) * (TILE-4) + 2;
      const by = y + hashRand(tx, ty, i+30) * (TILE-4) + 2;
      ctx.beginPath(); ctx.moveTo(bx, by+3); ctx.lineTo(bx, by); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bx+1, by+3); ctx.lineTo(bx+1, by+1); ctx.stroke();
    }
    // Occasional flower on plain-grass tiles
    if (t === "." && hashRand(tx, ty, 7) < 0.18) {
      const fx = x + 4 + hashRand(tx, ty, 8) * (TILE-8);
      const fy = y + 4 + hashRand(tx, ty, 9) * (TILE-8);
      const cols = ["#ffcf3a","#ff7fb8","#c9f0ff","#e8dfff"];
      const col = cols[Math.floor(hashRand(tx, ty, 10) * cols.length)];
      ctx.fillStyle = col;
      // 4-petal little flower
      ctx.beginPath(); ctx.arc(fx-2, fy, 1.6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(fx+2, fy, 1.6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(fx, fy-2, 1.6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(fx, fy+2, 1.6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#ffcf3a";
      ctx.beginPath(); ctx.arc(fx, fy, 1.2, 0, Math.PI*2); ctx.fill();
    }
  }
  // Path tiles — sandy strip with cobbles
  if (t === "P" || t === "D") {
    const g = ctx.createLinearGradient(0, y, 0, y+TILE);
    g.addColorStop(0, "#e5cf90"); g.addColorStop(1, "#c8a866");
    ctx.fillStyle = g; ctx.fillRect(x, y, TILE, TILE);
    // Pebble dots
    ctx.fillStyle = "rgba(120,90,40,0.5)";
    for (let i = 0; i < 4; i++) {
      const px = x + hashRand(tx, ty, i+50) * TILE;
      const py = y + hashRand(tx, ty, i+60) * TILE;
      ctx.beginPath(); ctx.arc(px, py, 1.2, 0, Math.PI*2); ctx.fill();
    }
    // Path edges — darker line where path meets grass on north/south only
    ctx.strokeStyle = "rgba(120,90,40,0.35)"; ctx.lineWidth = 1;
    if (tileAt(tx, ty-1) !== "P" && tileAt(tx, ty-1) !== "D") { ctx.beginPath(); ctx.moveTo(x, y+0.5); ctx.lineTo(x+TILE, y+0.5); ctx.stroke(); }
    if (tileAt(tx, ty+1) !== "P" && tileAt(tx, ty+1) !== "D") { ctx.beginPath(); ctx.moveTo(x, y+TILE-0.5); ctx.lineTo(x+TILE, y+TILE-0.5); ctx.stroke(); }
  }
  // Lab welcome mat
  if (t === "D") {
    const mx = x+2, my = y+6, mw = TILE-4, mh = TILE-10;
    // shadow under mat
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(mx+1, my+mh, mw, 2);
    // mat body with fringe
    ctx.fillStyle = "#5aa04a";
    rrect(mx, my, mw, mh, 3, "#5aa04a", "#2f6329", 1.5);
    ctx.strokeStyle = "#2f6329"; ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      const px2 = mx + 2 + i * 4;
      ctx.beginPath(); ctx.moveTo(px2, my+mh); ctx.lineTo(px2, my+mh+2); ctx.stroke();
    }
    // "LAB" text on mat
    ctx.fillStyle = "#f0e8b0"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `700 7px ${UI_FONT}`;
    ctx.fillText("LAB", mx + mw/2, my + mh/2);
  }
  // Tall grass — bushier layered clumps with darker outline
  if (t === "T") {
    // dark backing
    ctx.fillStyle = "#26762f"; ctx.fillRect(x, y, TILE, TILE);
    // clumps of grass tufts
    ctx.fillStyle = "#3ea547";
    for (let i = 0; i < 5; i++) {
      const bx = x + 3 + hashRand(tx, ty, i+100) * (TILE-6);
      const by = y + 4 + hashRand(tx, ty, i+110) * (TILE-6);
      ctx.beginPath();
      ctx.moveTo(bx, by+4);
      ctx.lineTo(bx-3, by+8);
      ctx.lineTo(bx-1, by-1);
      ctx.lineTo(bx+1, by-2);
      ctx.lineTo(bx+3, by-1);
      ctx.lineTo(bx+5, by+8);
      ctx.closePath(); ctx.fill();
    }
    // Highlights
    ctx.fillStyle = "#6ecf5f";
    for (let i = 0; i < 3; i++) {
      const bx = x + 5 + hashRand(tx, ty, i+130) * (TILE-10);
      const by = y + 4 + hashRand(tx, ty, i+140) * (TILE-6);
      ctx.beginPath(); ctx.arc(bx, by, 1.3, 0, Math.PI*2); ctx.fill();
    }
  }
  // Fence tile — grass under + wooden panel with two horizontal beams
  if (t === "F") {
    // grass base
    ctx.fillStyle = (tx+ty)%2===0 ? "#6ecf5f" : "#5eb84f"; ctx.fillRect(x, y, TILE, TILE);
    // posts
    ctx.fillStyle = "#8a5a34"; ctx.fillRect(x+3, y+2, 4, TILE-4); ctx.fillRect(x+TILE-7, y+2, 4, TILE-4);
    ctx.fillStyle = "#5a3a1a"; ctx.fillRect(x+3, y+2, 4, 2); ctx.fillRect(x+TILE-7, y+2, 4, 2);
    // beams
    ctx.fillStyle = "#a5764a";
    ctx.fillRect(x, y+7, TILE, 4);
    ctx.fillRect(x, y+15, TILE, 4);
    // beam edges shading
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(x, y+10, TILE, 1);
    ctx.fillRect(x, y+18, TILE, 1);
  }
}
function drawMap() {
  clear("#3a7d4a");
  for (let y=0;y<MAP_H;y++) for (let x=0;x<MAP_W;x++) drawTile(x,y);
  for (let y=0;y<MAP_H;y++) for (let x=0;x<MAP_W;x++) {
    if (MAP[y][x] === "H" && (x===0 || MAP[y][x-1] !== "H") && (y===0 || MAP[y-1][x] !== "H"))
      drawHouse(x*TILE, y*TILE);
    if (MAP[y][x] === "R" && (x===0 || MAP[y][x-1] !== "R"))
      drawRoof(x*TILE, y*TILE, "red");
    if (MAP[y][x] === "L" && (x===0 || MAP[y][x-1] !== "L"))
      drawRoof(x*TILE, y*TILE, "prof");
  }
}
// Chibi trainer sprite (v0.12.0) — outlined pixel-art style
function drawPlayer() {
  const p = game.player;
  let px, py;
  if (p.moving) {
    const t = p.t;
    px = (p.from.x + (p.to.x - p.from.x) * t) * TILE;
    py = (p.from.y + (p.to.y - p.from.y) * t) * TILE;
  } else { px = p.x * TILE; py = p.y * TILE; }
  drawTrainer(px + TILE/2, py + TILE, game.playerSprite, p.dir, p.moving ? game.frame : 0);
}
// Reusable so choose-screen shows the same sprite, just bigger.
function drawTrainer(cx, groundY, kind, dir, animFrame) {
  // Colours
  const shirt   = kind === "boy" ? "#3a7ee0" : "#e04a92";
  const shirtSh = kind === "boy" ? "#2a5aa0" : "#a83266";
  const hatCol  = kind === "boy" ? "#e04a3a" : "#8a4ad0";
  const hatSh   = kind === "boy" ? "#a02818" : "#5e2e94";
  const hair    = kind === "boy" ? "#3a2010" : "#c48a1a";
  const skin    = "#f5cfa6";
  const skinSh  = "#c99b6f";
  const pants   = "#2a3a6a";
  const shoes   = "#1a1a1a";
  const outline = "#0d0510";
  // Foot bob when moving
  const bob = animFrame ? (Math.floor(animFrame/6)%2) : 0;
  const x = cx - 8, gy = groundY;
  // Shadow
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath(); ctx.ellipse(cx, gy-1, 8, 3, 0, 0, Math.PI*2); ctx.fill();
  // Legs (with bob)
  ctx.fillStyle = outline;  ctx.fillRect(x+3, gy-8, 4, 6+ (bob?0:0));
  ctx.fillRect(x+9, gy-8, 4, 6);
  ctx.fillStyle = pants;    ctx.fillRect(x+4, gy-8, 2, 5);   ctx.fillRect(x+10, gy-8, 2, 5);
  ctx.fillStyle = shoes;    ctx.fillRect(x+3, gy-3+bob, 4, 3); ctx.fillRect(x+9, gy-3-bob, 4, 3);
  // Body (rounded outline)
  ctx.fillStyle = outline;
  ctx.fillRect(x+1, gy-16, 14, 9);
  ctx.fillStyle = shirt;
  ctx.fillRect(x+2, gy-15, 12, 7);
  // Body shading
  ctx.fillStyle = shirtSh;
  ctx.fillRect(x+2, gy-9, 12, 2);
  // Arms
  ctx.fillStyle = outline;
  ctx.fillRect(x,   gy-13, 2, 6);
  ctx.fillRect(x+14, gy-13, 2, 6);
  ctx.fillStyle = skin;
  ctx.fillRect(x, gy-9, 2, 2);
  ctx.fillRect(x+14, gy-9, 2, 2);
  // Head — outlined
  ctx.fillStyle = outline;
  ctx.fillRect(x+2, gy-25, 12, 10);
  ctx.fillStyle = skin;
  ctx.fillRect(x+3, gy-24, 10, 8);
  ctx.fillStyle = skinSh;
  ctx.fillRect(x+3, gy-18, 10, 1);
  // Hair (peeks under cap)
  ctx.fillStyle = hair;
  ctx.fillRect(x+3, gy-19, 10, 1);
  if (kind === "girl") {
    // Ponytail bunches on sides
    ctx.fillStyle = outline; ctx.fillRect(x+1, gy-22, 2, 6); ctx.fillRect(x+13, gy-22, 2, 6);
    ctx.fillStyle = hair;    ctx.fillRect(x+2, gy-21, 1, 4); ctx.fillRect(x+13, gy-21, 1, 4);
  }
  // Cap (baseball-cap silhouette)
  ctx.fillStyle = outline;
  ctx.fillRect(x+1, gy-27, 14, 4);
  ctx.fillStyle = hatCol;
  ctx.fillRect(x+2, gy-26, 12, 2);
  ctx.fillStyle = hatSh;
  ctx.fillRect(x+2, gy-24, 12, 1);
  // Cap peak — direction-aware
  ctx.fillStyle = outline;
  if (dir === "left")       ctx.fillRect(x-2, gy-24, 4, 3);
  else if (dir === "right") ctx.fillRect(x+14, gy-24, 4, 3);
  else                      ctx.fillRect(x+3, gy-23, 10, 2);
  ctx.fillStyle = hatCol;
  if (dir === "left")       ctx.fillRect(x-1, gy-23, 3, 1);
  else if (dir === "right") ctx.fillRect(x+14, gy-23, 3, 1);
  else                      ctx.fillRect(x+4, gy-22, 8, 1);
  // Face — eyes shift with direction (only visible when facing camera-side)
  ctx.fillStyle = outline;
  if (dir === "down") {
    ctx.fillRect(x+5, gy-20, 1, 2);
    ctx.fillRect(x+10, gy-20, 1, 2);
    // little mouth
    ctx.fillRect(x+7, gy-16, 2, 1);
  } else if (dir === "up") {
    // back of head, no face
    ctx.fillStyle = hair; ctx.fillRect(x+3, gy-19, 10, 3);
  } else if (dir === "left") {
    ctx.fillRect(x+4, gy-20, 1, 2);
    ctx.fillRect(x+3, gy-16, 2, 1);
  } else if (dir === "right") {
    ctx.fillRect(x+11, gy-20, 1, 2);
    ctx.fillRect(x+11, gy-16, 2, 1);
  }
  // Backpack tab peeking over shoulder
  ctx.fillStyle = outline; ctx.fillRect(x+5, gy-16, 6, 2);
  ctx.fillStyle = "#ffcf3a"; ctx.fillRect(x+6, gy-16, 4, 1);
}

// ==============================================================
// Creature drawing — one function per species (varied shapes)
// ==============================================================
function shadow(cx, cy, w, h) {
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath(); ctx.ellipse(cx, cy, w, h, 0, 0, Math.PI*2); ctx.fill();
}
function pupil(cx, cy, r, fill="#fff", eye="#111") {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = eye;  ctx.beginPath(); ctx.arc(cx, cy, r*0.5, 0, Math.PI*2); ctx.fill();
}
function polyFill(pts, color) {
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
}

// CrimsonFungus — fire dragon whelp
function drawCrimsonFungus(cx, cy, S, facing) {
  shadow(cx, cy+22*S, 22*S, 5*S);
  const f = facing;
  // tail
  polyFill([[cx-18*S*f, cy+8*S], [cx-26*S*f, cy-2*S], [cx-30*S*f, cy+10*S]], "#c94a1e");
  // body (rounded diamond)
  polyFill([[cx, cy-14*S],[cx+18*S, cy+2*S],[cx+12*S, cy+20*S],[cx-12*S, cy+20*S],[cx-18*S, cy+2*S]], "#e85a2a");
  // belly (yellow flame belly)
  polyFill([[cx, cy-2*S],[cx+10*S, cy+8*S],[cx+6*S, cy+18*S],[cx-6*S, cy+18*S],[cx-10*S, cy+8*S]], "#ffd05a");
  // wings
  polyFill([[cx-6*S, cy-10*S],[cx-18*S, cy-18*S],[cx-10*S, cy-4*S]], "#c94a1e");
  polyFill([[cx+6*S, cy-10*S],[cx+18*S, cy-18*S],[cx+10*S, cy-4*S]], "#c94a1e");
  // horns
  polyFill([[cx-6*S, cy-14*S],[cx-9*S, cy-22*S],[cx-3*S, cy-15*S]], "#8a2f10");
  polyFill([[cx+6*S, cy-14*S],[cx+9*S, cy-22*S],[cx+3*S, cy-15*S]], "#8a2f10");
  // head
  ctx.fillStyle = "#e85a2a";
  ctx.beginPath(); ctx.arc(cx, cy-6*S, 10*S, 0, Math.PI*2); ctx.fill();
  // snout
  polyFill([[cx+2*S*f, cy-6*S],[cx+14*S*f, cy-4*S],[cx+10*S*f, cy+2*S],[cx+2*S*f, cy+1*S]], "#c94a1e");
  // eyes
  pupil(cx-4*S, cy-8*S, 3*S);
  pupil(cx+4*S, cy-8*S, 3*S);
}

// Bolttoad — electric lightning bird
function drawBolttoad(cx, cy, S, facing) {
  shadow(cx, cy+22*S, 22*S, 5*S);
  const f = facing;
  // tail feathers
  polyFill([[cx-14*S*f, cy+4*S],[cx-26*S*f, cy-6*S],[cx-22*S*f, cy+10*S]], "#8dd0ff");
  polyFill([[cx-14*S*f, cy+8*S],[cx-24*S*f, cy+4*S],[cx-20*S*f, cy+16*S]], "#f2c744");
  // body (egg)
  ctx.fillStyle = "#f2c744";
  ctx.beginPath(); ctx.ellipse(cx, cy+4*S, 15*S, 18*S, 0, 0, Math.PI*2); ctx.fill();
  // belly stripe
  ctx.fillStyle = "#fff2a8";
  ctx.beginPath(); ctx.ellipse(cx, cy+10*S, 8*S, 10*S, 0, 0, Math.PI*2); ctx.fill();
  // lightning-bolt wings
  polyFill([[cx-15*S, cy-2*S],[cx-24*S, cy+4*S],[cx-18*S, cy+6*S],[cx-24*S, cy+14*S],[cx-14*S, cy+8*S]], "#8dd0ff");
  polyFill([[cx+15*S, cy-2*S],[cx+24*S, cy+4*S],[cx+18*S, cy+6*S],[cx+24*S, cy+14*S],[cx+14*S, cy+8*S]], "#8dd0ff");
  // head
  ctx.fillStyle = "#f2c744";
  ctx.beginPath(); ctx.arc(cx, cy-10*S, 10*S, 0, Math.PI*2); ctx.fill();
  // lightning-bolt crest
  polyFill([[cx-4*S, cy-18*S],[cx+2*S, cy-28*S],[cx-1*S, cy-22*S],[cx+5*S, cy-30*S],[cx+3*S, cy-22*S],[cx+7*S, cy-16*S]], "#fff2a8");
  // beak
  polyFill([[cx+2*S*f, cy-10*S],[cx+12*S*f, cy-8*S],[cx+2*S*f, cy-4*S]], "#e08a20");
  // eyes
  pupil(cx-4*S, cy-12*S, 3*S);
  pupil(cx+4*S, cy-12*S, 3*S);
  // feet
  polyFill([[cx-6*S, cy+20*S],[cx-9*S, cy+24*S],[cx-3*S, cy+24*S]], "#e08a20");
  polyFill([[cx+6*S, cy+20*S],[cx+9*S, cy+24*S],[cx+3*S, cy+24*S]], "#e08a20");
}

// Vinehop — grass sprout turtle
function drawVinehop(cx, cy, S, facing) {
  shadow(cx, cy+22*S, 24*S, 5*S);
  const f = facing;
  // shell (dome)
  ctx.fillStyle = "#3d8f42";
  ctx.beginPath(); ctx.ellipse(cx, cy+2*S, 22*S, 16*S, 0, Math.PI, 0); ctx.fill();
  // shell plates
  ctx.fillStyle = "#4fbf5a";
  for (let i=-2;i<=2;i++){
    polyFill([[cx+i*7*S, cy-13*S],[cx+(i+1)*7*S, cy-13*S],[cx+(i+1)*7*S-1, cy+1*S],[cx+i*7*S+1, cy+1*S]], i%2? "#4fbf5a":"#66d070");
  }
  // sprout on top
  polyFill([[cx, cy-14*S],[cx-6*S, cy-22*S],[cx+2*S, cy-18*S]], "#c4f770");
  polyFill([[cx, cy-14*S],[cx+8*S, cy-24*S],[cx+2*S, cy-18*S]], "#c4f770");
  // belly
  ctx.fillStyle = "#f6dfa0";
  ctx.beginPath(); ctx.ellipse(cx, cy+8*S, 18*S, 10*S, 0, 0, Math.PI*2); ctx.fill();
  // legs
  ctx.fillStyle = "#4fbf5a";
  ctx.beginPath(); ctx.arc(cx-14*S, cy+14*S, 6*S, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+14*S, cy+14*S, 6*S, 0, Math.PI*2); ctx.fill();
  // head
  ctx.fillStyle = "#4fbf5a";
  ctx.beginPath(); ctx.arc(cx+14*S*f, cy+2*S, 9*S, 0, Math.PI*2); ctx.fill();
  // eye
  pupil(cx+16*S*f, cy, 2.5*S);
  // smile
  ctx.strokeStyle = "#1a3a1a"; ctx.lineWidth = 1.5*S;
  ctx.beginPath(); ctx.arc(cx+16*S*f, cy+4*S, 3*S, 0, Math.PI); ctx.stroke();
}

// Tidefrog — water ink squid
function drawTidefrog(cx, cy, S, facing) {
  shadow(cx, cy+22*S, 22*S, 5*S);
  // mantle (dome)
  ctx.fillStyle = "#3a9be0";
  ctx.beginPath(); ctx.ellipse(cx, cy-2*S, 18*S, 20*S, 0, Math.PI, 0); ctx.fill();
  // mantle spots
  ctx.fillStyle = "#c9f0ff";
  ctx.beginPath(); ctx.arc(cx-6*S, cy-8*S, 2*S, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+6*S, cy-12*S, 2*S, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+1*S, cy-16*S, 2*S, 0, Math.PI*2); ctx.fill();
  // fins on top
  polyFill([[cx-14*S, cy-14*S],[cx-22*S, cy-20*S],[cx-10*S, cy-8*S]], "#2a7bb0");
  polyFill([[cx+14*S, cy-14*S],[cx+22*S, cy-20*S],[cx+10*S, cy-8*S]], "#2a7bb0");
  // tentacles (5 wavy)
  for (let i=-2;i<=2;i++){
    const bx = cx + i*6*S;
    ctx.strokeStyle = "#3a9be0"; ctx.lineWidth = 4*S; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(bx, cy+8*S);
    ctx.quadraticCurveTo(bx + Math.sin(i)*5*S, cy+14*S, bx + i*2*S, cy+22*S);
    ctx.stroke();
  }
  // face
  pupil(cx-5*S, cy-4*S, 3.5*S);
  pupil(cx+5*S, cy-4*S, 3.5*S);
  // small mouth
  ctx.fillStyle = "#1a3a5a"; ctx.beginPath(); ctx.arc(cx, cy+2*S, 2*S, 0, Math.PI); ctx.fill();
}

// CryptyCrab — dual-type normal/ghost. Wispy purple-white crab with a ghostly
// aura and two big pincers, one floating away from the body.
function drawCryptyCrab(cx, cy, S, facing) {
  shadow(cx, cy+22*S, 24*S, 5*S);
  const f = facing;
  // Ghostly aura underneath
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = "#e8dfff";
  ctx.beginPath(); ctx.ellipse(cx, cy+8*S, 30*S, 22*S, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  // Legs (three per side)
  ctx.strokeStyle = "#7f6ea0"; ctx.lineWidth = 3*S; ctx.lineCap = "round";
  for (let i=0;i<3;i++){
    const off = (i-1)*7*S;
    ctx.beginPath();
    ctx.moveTo(cx-14*S, cy+8*S);
    ctx.quadraticCurveTo(cx-22*S+off, cy+18*S, cx-24*S+off, cy+22*S);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx+14*S, cy+8*S);
    ctx.quadraticCurveTo(cx+22*S-off, cy+18*S, cx+24*S-off, cy+22*S);
    ctx.stroke();
  }
  // Body (rounded hex)
  polyFill([[cx-16*S, cy-2*S],[cx-10*S, cy-12*S],[cx+10*S, cy-12*S],
            [cx+16*S, cy-2*S],[cx+10*S, cy+10*S],[cx-10*S, cy+10*S]], "#b8a8d0");
  // Belly highlight
  polyFill([[cx-8*S, cy-2*S],[cx+8*S, cy-2*S],[cx+6*S, cy+8*S],[cx-6*S, cy+8*S]], "#e8dfff");
  // Stalked eyes
  ctx.strokeStyle = "#7f6ea0"; ctx.lineWidth = 2*S;
  ctx.beginPath(); ctx.moveTo(cx-6*S, cy-10*S); ctx.lineTo(cx-8*S, cy-18*S); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+6*S, cy-10*S); ctx.lineTo(cx+8*S, cy-18*S); ctx.stroke();
  pupil(cx-8*S, cy-20*S, 3*S);
  pupil(cx+8*S, cy-20*S, 3*S);
  // Grounded pincer (opposite the facing)
  polyFill([[cx-16*S*f, cy-2*S],[cx-24*S*f, cy-8*S],[cx-22*S*f, cy+4*S]], "#b8a8d0");
  polyFill([[cx-22*S*f, cy-8*S],[cx-28*S*f, cy-12*S],[cx-24*S*f, cy-4*S]], "#b8a8d0");
  // Floating pincer (in the facing direction) — offset upward to look weightless
  ctx.save();
  ctx.globalAlpha = 0.95;
  polyFill([[cx+18*S*f, cy-14*S],[cx+28*S*f, cy-22*S],[cx+30*S*f, cy-10*S]], "#b8a8d0");
  polyFill([[cx+28*S*f, cy-22*S],[cx+34*S*f, cy-28*S],[cx+30*S*f, cy-18*S]], "#b8a8d0");
  ctx.restore();
  // Wispy ghost trail dots between body and floating pincer
  ctx.fillStyle = "rgba(232,223,255,0.65)";
  ctx.beginPath(); ctx.arc(cx+12*S*f, cy-6*S, 2*S, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+16*S*f, cy-10*S, 1.5*S, 0, Math.PI*2); ctx.fill();
}

// Generic fallback for auto-added species whose polygon shape is "blob".
// Uses the species' color + accent so it at least looks distinctive.
function drawBlob(cx, cy, S, facing, species) {
  const sd = SPECIES[species] || {};
  const body = sd.color  || "#a8a8a8";
  const belly = sd.accent || "#e0e0e0";
  const f = facing;
  shadow(cx, cy+22*S, 22*S, 5*S);
  // Rounded body
  polyFill([[cx, cy-16*S],[cx+18*S, cy-4*S],[cx+14*S, cy+18*S],[cx-14*S, cy+18*S],[cx-18*S, cy-4*S]], body);
  polyFill([[cx, cy-2*S],[cx+9*S, cy+6*S],[cx+6*S, cy+16*S],[cx-6*S, cy+16*S],[cx-9*S, cy+6*S]], belly);
  // Blinky eyes turned to the facing side
  pupil(cx-4*S, cy-8*S, 2.5*S);
  pupil(cx+4*S, cy-8*S, 2.5*S);
  // A tiny smile
  ctx.strokeStyle = "#2a1a1a"; ctx.lineWidth = 1.5*S;
  ctx.beginPath(); ctx.arc(cx + 2*S*f, cy+2*S, 3*S, 0, Math.PI); ctx.stroke();
  // Little feet
  polyFill([[cx-8*S, cy+18*S],[cx-11*S, cy+22*S],[cx-5*S, cy+22*S]], body);
  polyFill([[cx+8*S, cy+18*S],[cx+11*S, cy+22*S],[cx+5*S, cy+22*S]], body);
}

function drawMon(m, cx, cy, scale=1, facing=1, pose="side") {
  // If species has been removed from the manifest, silently fall back to a blob
  // rather than crashing — this keeps forked games (Sam vs Charlie) safe when
  // one no longer has a creature the other still references.
  if (!m || !SPECIES[m.species]) return drawBlob(cx, cy, scale, facing, m && m.species);
  // Prefer real 3D model when this species has a .glb loaded
  const t = (typeof performance !== "undefined" ? performance.now() : Date.now()) / 1000;
  if (Mon3D.has(m.species) && Mon3D.render(m.species, ctx, cx, cy, scale, facing, t, pose)) return;
  // Fallback: hand-drawn polygon art
  const sh = SPECIES[m.species].shape;
  if (sh === "dragon") return drawCrimsonFungus(cx, cy, scale, facing);
  if (sh === "bird")   return drawBolttoad(cx, cy, scale, facing);
  if (sh === "turtle") return drawVinehop(cx, cy, scale, facing);
  if (sh === "squid")  return drawTidefrog(cx, cy, scale, facing);
  if (sh === "crab")   return drawCryptyCrab(cx, cy, scale, facing);
  return drawBlob(cx, cy, scale, facing, m.species);
}

// ==============================================================
// VFX — per-type move animation
// ==============================================================
// vfx = { type, elapsed, dur, atX, atY, phase:"windup"|"impact", onImpact, onEnd, particles }
function startVfx(type, atX, atY, onImpact, onEnd) {
  game.vfx = {
    type, elapsed: 0, dur: 900, atX, atY,
    windupUntil: 350, impactUntil: 750,
    firedImpact: false,
    onImpact, onEnd, particles: []
  };
  // Play SFX at windup
  const sfx = Audio.SFX[type] || Audio.SFX.normal;
  sfx();
}
function updateVfx(dt) {
  const v = game.vfx; if (!v) return;
  v.elapsed += dt;
  // spawn particles
  if (v.type === "fire" && v.elapsed < v.impactUntil) {
    for (let i=0;i<3;i++) v.particles.push({x:v.atX+(Math.random()-0.5)*40, y:v.atY+20, vx:(Math.random()-0.5)*1, vy:-1-Math.random()*2, life:1, color:"#ffcf3a"});
  }
  if (v.type === "electric" && v.elapsed < v.impactUntil) {
    for (let i=0;i<2;i++) v.particles.push({x:v.atX+(Math.random()-0.5)*30, y:v.atY+(Math.random()-0.5)*30, vx:0, vy:0, life:0.6, color:"#fff2a8", star:true});
  }
  if (v.type === "grass" && v.elapsed < v.impactUntil) {
    for (let i=0;i<2;i++) v.particles.push({x:v.atX+(Math.random()-0.5)*40, y:v.atY-20, vx:(Math.random()-0.5)*2, vy:Math.random()*1.5+0.5, life:1, color:"#4bd07a", leaf:true});
  }
  if (v.type === "water" && v.elapsed < v.impactUntil) {
    for (let i=0;i<3;i++) v.particles.push({x:v.atX+(Math.random()-0.5)*40, y:v.atY+(Math.random()-0.5)*30, vx:(Math.random()-0.5)*2, vy:(Math.random()-0.5)*1, life:0.8, color:"#c9f0ff"});
  }
  if (v.type === "normal" && v.elapsed < 300) {
    for (let i=0;i<1;i++) v.particles.push({x:v.atX+(Math.random()-0.5)*20, y:v.atY+(Math.random()-0.5)*20, vx:0, vy:0, life:0.4, color:"#fff"});
  }
  v.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= dt/600; });
  v.particles = v.particles.filter(p => p.life > 0);
  // impact hook
  if (!v.firedImpact && v.elapsed >= v.windupUntil) {
    v.firedImpact = true;
    if (v.onImpact) v.onImpact();
  }
  if (v.elapsed >= v.dur) {
    const fn = v.onEnd;
    game.vfx = null;
    if (fn) fn();
  }
}
function drawVfxOverlay() {
  const v = game.vfx; if (!v) return;
  // Full-screen tint at impact
  if (v.firedImpact && v.elapsed < v.impactUntil) {
    const tintMap = { fire:"rgba(255,120,20,0.25)", electric:"rgba(255,240,120,0.35)",
                      grass:"rgba(90,220,110,0.22)", water:"rgba(120,200,255,0.28)", normal:"rgba(255,255,255,0.18)" };
    rect(0,0,W,H, tintMap[v.type] || "rgba(255,255,255,0.1)");
    // Screen shake handled by draw wrapper elsewhere; here draw a bright ring at impact center
    ctx.save();
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = v.type === "electric" ? "#fff" : "#ffcf3a";
    ctx.lineWidth = 4;
    const r = 20 + (v.elapsed - v.windupUntil) * 0.2;
    ctx.beginPath(); ctx.arc(v.atX, v.atY, r, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  // Type-specific windup effects
  if (v.type === "electric" && v.elapsed < v.impactUntil) {
    // Zig-zag bolts from player toward target
    ctx.save();
    ctx.strokeStyle = "#fff2a8"; ctx.lineWidth = 3;
    for (let b=0;b<3;b++){
      ctx.beginPath();
      let x = 90, y = 340; // player mon
      ctx.moveTo(x, y);
      const tx = v.atX, ty = v.atY;
      for (let i=1;i<=6;i++){
        const t = i/6;
        const px = x + (tx-x)*t + (Math.random()-0.5)*18;
        const py = y + (ty-y)*t + (Math.random()-0.5)*18;
        ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  if (v.type === "fire" && v.elapsed < v.impactUntil) {
    // Fireball travelling
    const t = Math.min(1, v.elapsed / v.windupUntil);
    const sx = 90, sy = 340;
    const bx = sx + (v.atX-sx)*t, by = sy + (v.atY-sy)*t;
    ctx.fillStyle = "#ffcf3a";
    ctx.beginPath(); ctx.arc(bx, by, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#e85a2a";
    ctx.beginPath(); ctx.arc(bx, by, 7, 0, Math.PI*2); ctx.fill();
  }
  if (v.type === "water" && v.elapsed < v.impactUntil) {
    // Wave crest sweeping across
    const t = Math.min(1, v.elapsed / v.windupUntil);
    const wx = 90 + (v.atX-90)*t;
    ctx.strokeStyle = "#c9f0ff"; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i=0;i<60;i++){
      const px = wx - 30 + i;
      const py = v.atY + Math.sin(i*0.4 + v.elapsed*0.02)*8;
      if (i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  if (v.type === "grass" && v.elapsed < v.impactUntil) {
    // Roots/vines curling up at target
    ctx.strokeStyle = "#4bd07a"; ctx.lineWidth = 4; ctx.lineCap = "round";
    for (let i=-2;i<=2;i++){
      ctx.beginPath();
      const bx = v.atX + i*8;
      ctx.moveTo(bx, v.atY + 30);
      const swing = Math.sin(v.elapsed*0.02 + i)*4;
      ctx.quadraticCurveTo(bx+swing, v.atY+10, bx + i*3, v.atY - 10 + i*i);
      ctx.stroke();
    }
  }
  // Draw particles
  v.particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life);
    if (p.star) {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      for (let i=0;i<8;i++){
        const a = i*Math.PI/4;
        const r = i%2? 2 : 6;
        const px = p.x + Math.cos(a)*r, py = p.y + Math.sin(a)*r;
        if (i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
    } else if (p.leaf) {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 5, 2.5, Math.sin(p.life*10), 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  });
}
// Screen shake — offset drawing during impact frames
function shakeOffset() {
  const v = game.vfx;
  if (!v || !v.firedImpact || v.elapsed >= v.impactUntil) return {x:0,y:0};
  const strength = v.type === "electric" ? 4 : v.type === "fire" ? 5 : v.type === "water" ? 3 : 3;
  return { x: (Math.random()-0.5)*strength*2, y: (Math.random()-0.5)*strength*2 };
}

// ==============================================================
// Overworld / battle logic
// ==============================================================
function tryStartMove(dx, dy, dir) {
  const p = game.player;
  if (p.moving) return;
  p.dir = dir;
  const nx = p.x + dx, ny = p.y + dy;
  if (!walkable(tileAt(nx, ny))) return;
  p.from = { x: p.x, y: p.y }; p.to = { x: nx, y: ny };
  p.moving = true; p.t = 0;
  Audio.SFX.step();
}
function updateOverworld() {
  const p = game.player;
  if (p.moving) {
    p.t += 0.14;
    if (p.t >= 1) {
      p.t = 1; p.moving = false;
      p.x = p.to.x; p.y = p.to.y;
      const here = tileAt(p.x, p.y);
      if (here === "D") {
        // Enter the professor's lab
        openProfessor();
      } else if (here === "T" && game.hasStarter && game.encounterCooldown <= 0) {
        if (rng() < 0.28) startEncounter();
        else game.encounterCooldown = 3;
      } else if (game.encounterCooldown > 0) game.encounterCooldown--;
    }
  } else {
    if (keys.up)         tryStartMove(0, -1, "up");
    else if (keys.down)  tryStartMove(0,  1, "down");
    else if (keys.left)  tryStartMove(-1, 0, "left");
    else if (keys.right) tryStartMove(1,  0, "right");
    if (pressed.b) { Audio.SFX.menu(); game.state = STATE.COLLECTION; game.dexView = "grid"; }
  }
}
function startEncounter() {
  // Encounters are gated on hasStarter in the overworld update, so party is guaranteed non-empty here.
  Audio.SFX.encounter();
  enterBattle();
}

// ---- Professor / starter select ----
function openProfessor() {
  if (game.hasStarter) {
    showMsg([
      `Professor Ribbit: Back so soon?`,
      `Go on now — Fundude's CroakyMons won't catch themselves!`
    ], null);
    // step off the door so it doesn't retrigger
    stepOffDoor();
    return;
  }
  showMsg([
    `Professor Ribbit: Welcome to my lab!`,
    `I have three young CroakyMons here.`,
    `One of them will be your very own partner!`,
    `Choose carefully — pick the one that feels right for you.`
  ], () => { game.state = STATE.PROFESSOR; game.starterCursor = 1; });
}
function stepOffDoor() {
  // Nudge the player one tile downward off the door mat.
  const p = game.player;
  if (tileAt(p.x, p.y+1) && walkable(tileAt(p.x, p.y+1))) {
    p.from = { x: p.x, y: p.y }; p.to = { x: p.x, y: p.y+1 };
    p.moving = true; p.t = 0; p.dir = "down";
  }
}
function confirmStarter() {
  const sp = STARTERS[game.starterCursor];
  const mon = makeMon(sp);
  game.party.push(mon);
  game.caught.add(sp);
  game.hasStarter = true;
  Audio.SFX.catchWin();
  showMsg([
    `Professor Ribbit: A fine choice!`,
    `${displayName(sp)} is yours!`,
    `Now head into the tall grass to find wild CroakyMons.`,
    `Team Evil Soup are up to something — be careful out there!`
  ], () => { game.state = STATE.OVERWORLD; stepOffDoor(); });
}
function updateProfessor() {
  if (pressed.left)  { game.starterCursor = (game.starterCursor + STARTERS.length - 1) % STARTERS.length; Audio.SFX.menu(); }
  if (pressed.right) { game.starterCursor = (game.starterCursor + 1) % STARTERS.length; Audio.SFX.menu(); }

}

function enterBattle(forceWildDifferentFrom) {

  // reachable by evolving their base form.
  const wildable = ALL_SPECIES.filter(s => !SPECIES[s].evolutionOf);
  const remaining = wildable.filter(s => !game.caught.has(s));
  let pool = remaining.length ? remaining : wildable;
  if (!pool.length) pool = ALL_SPECIES; // absolute fallback
  if (forceWildDifferentFrom) { const f = pool.filter(s => s !== forceWildDifferentFrom); if (f.length) pool = f; }
  const wildSp = pool[Math.floor(rng()*pool.length)];
  const wild = makeMon(wildSp);
  const active = game.party[0];
  game.battle = {
    wild, active, menu: "root", cursor: 0,
    log: [`A wild ${displayName(wildSp)} appeared!`, `Go, ${displayName(active.species)}!`],
    turnLock: false, ended: false, caughtThis: false, ranAway: false, catchAttempts: 0,
  };
  game.state = STATE.BATTLE;
}
const ROOT_OPTS = ["FIGHT","CATCH","RUN"];
function updateBattle() {
  const b = game.battle; if (!b || b.turnLock) return;
  if (b.ended) {
    if (pressed.a) {
      Audio.SFX.select();
      if (game.caught.size === ALL_SPECIES.length) { Audio.SFX.win(); game.state = STATE.WIN; }
      else { game.state = STATE.OVERWORLD; game.encounterCooldown = 4; }
      game.battle = null;
    }
    return;
  }
  if (b.menu === "root") {
    if (pressed.up)   { b.cursor = (b.cursor + ROOT_OPTS.length - 1) % ROOT_OPTS.length; Audio.SFX.menu(); }
    if (pressed.down) { b.cursor = (b.cursor + 1) % ROOT_OPTS.length; Audio.SFX.menu(); }
    if (pressed.a) {
      Audio.SFX.select();
      const choice = ROOT_OPTS[b.cursor];
      if (choice === "FIGHT") { b.menu = "fight"; b.cursor = 0; }
      else if (choice === "CATCH") doCatch();
      else if (choice === "RUN") { showMsg([`Got away safely!`], () => { b.ended = true; b.ranAway = true; }); }
    }
  } else if (b.menu === "fight") {
    const moves = b.active.moves;
    if (pressed.up || pressed.left)   { b.cursor = (b.cursor + moves.length - 1) % moves.length; Audio.SFX.menu(); }
    if (pressed.down || pressed.right) { b.cursor = (b.cursor + 1) % moves.length; Audio.SFX.menu(); }
    if (pressed.b) { Audio.SFX.back(); b.menu = "root"; b.cursor = 0; return; }
    if (pressed.a) { Audio.SFX.select(); doFightTurn(moves[b.cursor]); }
  }
}
function doFightTurn(moveKey) {
  const b = game.battle; b.turnLock = true;
  const m = MOVES[moveKey];
  const r1 = damage(b.active, b.wild, moveKey, rng);
  // Play attack VFX aimed at wild (top-right platform ~ 270,200)
  startVfx(m.type, 270, 200,
    () => {
      b.wild.hp = Math.max(0, b.wild.hp - r1.dmg);
      Audio.SFX.hit(r1.eff);
    },
    () => {
      const lines = [`${displayName(b.active.species)} used ${m.name}!`, effLine(r1.eff, r1.dmg)];
      if (b.wild.hp <= 0) {
        lines.push(`Wild ${displayName(b.wild.species)} fainted!`, `It ran off before you could catch it.`);
        Audio.SFX.faint();
        b.active.wins = (b.active.wins || 0) + 1;
        const evolveTo = evolutionTargetFor(b.active);
        showMsg(lines, () => {
          if (evolveTo) return startEvolution(b.active, evolveTo, () => { b.ended = true; b.turnLock = false; b.menu = "root"; b.cursor = 0; });
          b.ended = true; b.turnLock = false; b.menu = "root"; b.cursor = 0;
        });
        return;
      }
      // Enemy turn
      const enemyMove = b.wild.moves[Math.floor(rng()*b.wild.moves.length)];
      const em = MOVES[enemyMove];
      const r2 = damage(b.wild, b.active, enemyMove, rng);
      showMsg(lines, () => {
        startVfx(em.type, 90, 340,
          () => { b.active.hp = Math.max(0, b.active.hp - r2.dmg); Audio.SFX.hit(r2.eff); },
          () => {
            const l2 = [`Wild ${displayName(b.wild.species)} used ${em.name}!`, effLine(r2.eff, r2.dmg)];
            if (b.active.hp <= 0) {
              l2.push(`${displayName(b.active.species)} fainted!`, `You scurried home to recover.`);
              Audio.SFX.faint();
              showMsg(l2, () => { game.party.forEach(m => m.hp = m.maxHP); b.ended = true; b.turnLock = false; b.menu = "root"; b.cursor = 0; });
            } else {
              showMsg(l2, () => { b.turnLock = false; b.menu = "root"; b.cursor = 0; });
            }
          }
        );
      });
    }
  );
}
// v0.12.0 — evolution
// Returns the PascalCase key of the mon's next form, or null if none applies.
function evolutionTargetFor(mon) {
  if (!mon || !mon.species) return null;
  const sd = SPECIES[mon.species];
  if (!sd || !sd.evolvesTo) return null;
  const targetKey = kebabToPascal(sd.evolvesTo);
  if (!SPECIES[targetKey]) return null;                  // manifest missing the target
  const threshold = sd.evolvesAtWins || DEFAULT_EVOLVE_AT_WINS;
  return (mon.wins >= threshold) ? targetKey : null;
}
// Plays a short evolution scene as a message chain, swaps species in place, then
// calls `then` when the player dismisses the final line.
function startEvolution(mon, targetKey, then) {
  const fromName = displayName(mon.species);
  const toName   = displayName(targetKey);
  Audio.SFX.win();
  showMsg([
    `What?! ${fromName} is evolving!`,
    `... ... ...`,
    `Congratulations! ${fromName} evolved into ${toName}!`,
  ], () => {
    // Swap species + inherit stats appropriately
    const newSd = SPECIES[targetKey];
    mon.species = targetKey;
    mon.type    = newSd.type;
    mon.type2   = newSd.type2 || null;
    mon.moves   = newSd.moves.slice();
    // Keep hp fraction — but at least full-heal a little for the drama
    const frac  = Math.max(0.6, mon.hp / mon.maxHP);
    mon.maxHP   = newSd.maxHP;
    mon.hp      = Math.min(newSd.maxHP, Math.round(newSd.maxHP * frac));
    mon.wins    = 0;
    // Register in the dex so the evolved form appears in the CroakyDex
    game.caught.add(targetKey);
    if (then) then();
  });
}

function effLine(eff, dmg) {
  if (eff > 1.5) return `It's super effective! (${dmg})`;
  if (eff < 0.9) return `It's not very effective... (${dmg})`;
  return `Hit for ${dmg}.`;
}
function doCatch() {
  const b = game.battle; b.turnLock = true; b.catchAttempts++;
  const frac = b.wild.hp / b.wild.maxHP;
  const chance = Math.max(0.15, 0.85 - frac * 0.7);
  const success = rng() < chance;
  Audio.SFX.catchThrow();
  setTimeout(()=>Audio.SFX.catchShake(), 250);
  setTimeout(()=>Audio.SFX.catchShake(), 500);
  const lines = [`You threw a Froggo Ball!`, `... shake ... shake ...`];
  if (success) {
    Audio.SFX.catchWin();
    lines.push(`Gotcha! ${displayName(b.wild.species)} was caught!`);
    if (!game.caught.has(b.wild.species)) {
      game.caught.add(b.wild.species);
      game.party.push(makeMon(b.wild.species));
      lines.push(`A new CroakyMon joined your team!`);
    } else lines.push(`(You already have one — you set it free.)`);
    showMsg(lines, () => { b.ended = true; b.caughtThis = true; b.turnLock = false; });
  } else {
    Audio.SFX.catchFail();
    lines.push(`Oh no! The ${displayName(b.wild.species)} broke free!`);
    const enemyMove = b.wild.moves[Math.floor(rng()*b.wild.moves.length)];
    const em = MOVES[enemyMove];
    const r = damage(b.wild, b.active, enemyMove, rng);
    showMsg(lines, () => {
      startVfx(em.type, 90, 340,
        () => { b.active.hp = Math.max(0, b.active.hp - r.dmg); Audio.SFX.hit(r.eff); },
        () => {
          const l2 = [`Wild ${displayName(b.wild.species)} used ${em.name}!`, effLine(r.eff, r.dmg)];
          if (b.active.hp <= 0) {
            l2.push(`${displayName(b.active.species)} fainted!`, `You scurried home to recover.`);
            Audio.SFX.faint();
            showMsg(l2, () => { game.party.forEach(m => m.hp = m.maxHP); b.ended = true; b.turnLock = false; });
          } else showMsg(l2, () => { b.turnLock = false; b.menu = "root"; b.cursor = 0; });
        }
      );
    });
  }
}

function wrapText(str, x, y, maxW, lh, size, color) {
  ctx.font = `700 ${size}px 'Fredoka', -apple-system, sans-serif`;
  ctx.fillStyle = color; ctx.textAlign = "left"; ctx.textBaseline = "top";
  const words = str.split(" "); let line = "", yy = y;
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, yy); yy += lh; line = w; }
    else line = test;
  }
  if (line) ctx.fillText(line, x, yy);
}

// Auto-arranges a set of species into a centred grid (rows of at most `perRow`).
// Used on title / win screens so the layout adapts to any subset of ALL_SPECIES.
function layoutMonsGrid(species, cx, topY, colGap, rowGap, perRow, pose, scale) {
  const N = species.length;
  if (!N) return;
  for (let i = 0; i < N; i++) {
    const row = Math.floor(i / perRow);
    const rowFirst = row * perRow;
    const rowCount = Math.min(perRow, N - rowFirst);
    const col = i - rowFirst;
    const startX = cx - ((rowCount - 1) * colGap) / 2;
    const px = startX + col * colGap;
    const py = topY + row * rowGap;
    drawMon({ species: species[i] }, px, py, scale, 0, pose);
  }
}

// Bouncy chunky logo — outlined letters with sunset gradient, per-letter tilt & bob.
function drawLogo(cx, cy, tSec) {
  const word = GAME_TITLE;
  const size = 54;
  // Per-game style presets — extend freely
  const STYLES = {
    // Sam: warm fire vibe — sunset gradient, chunky tilt, bouncy bob
    sunset: {
      grad:    [["#fff2a8",0], ["#ffcf3a",0.45], ["#e85a2a",1]],
      outline: "#1a0a2a", outlineWidth: 8,
      shadow:  "rgba(10,5,30,0.55)", shadowDx: 4, shadowDy: 5,
      bounceAmp: 3, bounceHz: 3, tiltFn: (i) => Math.sin(i*0.7) * 0.06,
      shine:   0.55, glow: 0,
    },
    // Charlie: spooky ghost vibe — teal→purple→pink gradient, wavy letters,
    // cyan glow halo, slower sway
    spooky: {
      grad:    [["#c9f0ff",0], ["#8a72b8",0.45], ["#ff7fb8",1]],
      outline: "#0a0518", outlineWidth: 9,
      shadow:  "rgba(0,0,0,0.6)", shadowDx: 5, shadowDy: 5,
      bounceAmp: 5, bounceHz: 1.8, tiltFn: (i, t) => Math.sin(t*2 + i*0.4) * 0.08,
      shine:   0.35, glow: 18, glowColor: "#4be0d0",
    },
  };
  const s = STYLES[GAME_LOGO_STYLE] || STYLES.sunset;
  ctx.save();
  ctx.font = `400 ${size}px ${LOGO_FONT}`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const widths = [];
  let total = 0;
  for (const ch of word) { const w = ctx.measureText(ch).width; widths.push(w); total += w; }
  total += (word.length - 1) * 3; // small tracking
  let x = cx - total/2;
  for (let i = 0; i < word.length; i++) {
    const ch = word[i];
    const half = widths[i] / 2;
    const bx = x + half;
    const bounce = Math.sin(tSec * s.bounceHz + i * 0.55) * s.bounceAmp;
    const tilt = s.tiltFn(i, tSec);
    ctx.save();
    ctx.translate(bx, cy + bounce);
    ctx.rotate(tilt);
    // Optional glow halo
    if (s.glow > 0) {
      ctx.shadowColor = s.glowColor;
      ctx.shadowBlur  = s.glow + Math.sin(tSec*4 + i)*4;
    }
    // drop shadow
    ctx.fillStyle = s.shadow;
    ctx.fillText(ch, s.shadowDx, s.shadowDy);
    // thick outline
    ctx.strokeStyle = s.outline; ctx.lineWidth = s.outlineWidth; ctx.lineJoin = "round";
    ctx.strokeText(ch, 0, 0);
    // gradient fill
    const g = ctx.createLinearGradient(0, -size/2, 0, size/2);
    for (const stop of s.grad) g.addColorStop(stop[1], stop[0]);
    ctx.fillStyle = g;
    ctx.fillText(ch, 0, 0);
    // shine on top edge
    if (s.shine > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(-widths[i]/2, -size/2, widths[i], size*0.28);
      ctx.clip();
      ctx.globalAlpha = s.shine;
      ctx.fillStyle = "#fff";
      ctx.fillText(ch, 0, 0);
      ctx.restore();
    }
    ctx.shadowBlur = 0;
    ctx.restore();
    x += widths[i] + 3;
  }
  ctx.restore();
}
